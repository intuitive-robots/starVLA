# RoboTwin mechanism arm: bidirectional within each camera/language/state block and
# directed causal flow between blocks. Token-only bimanual state; relative joints.
run_id: p0_rt_modblk_left_right_state_relq_b64_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_robotwin_insights
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: false
    attention_topology: modality_block_causal
    attn_implementation: flash_attention_3
    vl_hidden_dim: 2048
  action_model:
    action_dim: 14
    state_dim: 0
    token_state_dim: 16
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0
    action_model_type: DiT-B
    action_hidden_dim: 768
    hidden_size: 768
    add_pos_embed: true
    max_seq_len: 1024
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
  state_token_mode: reserved_ids
  state_routing: token_only
  state_num_bins: 256
  state_token_source: rare_real
  trainable_bin_embedding: false
  state_token_permutation: [0, 1, 2, 3, 4, 5, 12, 6, 7, 8, 9, 10, 11, 13]
  state_token_group_sizes: [7, 7]
  state_token_group_names: [left, right]

datasets:
  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/project1/m3/blank4/code/starVLA/playground/Datasets/RoboTwin2_v3
    data_mix: robotwin_aloha_clean50_v3
    action_type: relative_qpos
    action_mode: rel
    action_mode_apply_keys: [action.left_joints, action.right_joints]
    sequential_step_sampling: false
    per_device_batch_size: 16
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    holdout_trajectories_per_task: 1
    num_workers: 16
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
    include_state: true
    augmentation: crop_photometric
    pack_image_size: [224, 224]
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  logging_frequency: 100
  save_full_training_state: true
  save_total_limit: 32
  full_state_save_total_limit: 2
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  weight_decay: 0.0

use_deepspeed: true
