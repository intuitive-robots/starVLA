# VLA-Arena L1_L + GR00T DiT action head, no CoT supervision (plain baseline).
#
# Mirrors the LIBERO-plus GR00T recipe (Qwen3.5-0.8B + DiT-B, 30k steps) so the
# two benchmarks are directly comparable; VLA-Arena specifics are called out below.
#
# Dataset: ~/datasets/lerobot_3_0/VLA-Arena/VLA_Arena_L1_L_lerobot_openpi
#   LeRobot v2.1 layout (per-episode parquet + per-episode mp4), 2750 episodes,
#   55 tasks, fps 10, features image/wrist_image/state/actions.
#   NOTE lerobot_version is "v2.0": the loader only branches on "v2.0" vs "v3.0"
#   (datasets.py:1317/1328), and v2.1 uses the v2.0 per-episode file layout.
#
# PREREQUISITES (both are one-time setup, see examples/VLA-Arena/data_preparation.sh):
#   1. meta/modality.json must exist in the dataset dir -- it is NOT shipped with
#      the HF download. Copy it:
#        cp examples/VLA-Arena/train_files/modality.json \
#           ~/datasets/lerobot_3_0/VLA-Arena/VLA_Arena_L1_L_lerobot_openpi/meta/
#   2. data_mix "vla_arena_L1_L" must be registered in
#      examples/VLA-Arena/train_files/data_registry/data_config.py
#      (the shipped registry only defines L0_S / L0_M / L0_L).
#
# CoT counterparts:
#   starvla_vla_arena_L1_L_gr00t_cot_trace_ours_qwen.yaml
#   starvla_vla_arena_L1_L_gr00t_cot_trace_det_qwen.yaml
run_id: vla_arena_L1_L_qwen08b_gr00t
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_vla_arena
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3.5-0.8B
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7          # delta EEF (dx,dy,dz,droll,dpitch,dyaw) + gripper
    state_dim: 0           # include_state:false -> no state conditioning
    action_horizon: 8
    action_model_type: DiT-B
    hidden_size: 768
    action_hidden_dim: 768
    add_pos_embed: True
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      dropout: 0.1

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/VLA-Arena
    data_mix: vla_arena_L1_L
    action_type: delta_eef       # VLA-Arena is delta EEF, not LIBERO's delta_qpos
    sequential_step_sampling: False

    per_device_batch_size: 32
    load_all_data_for_training: true
    # v2.1 stores one mp4 per episode; torchvision_av matches the shipped
    # VLA-Arena config (torchcodec is used for LIBERO-plus's large v3.0 AV1 files).
    video_backend: torchvision_av
    lerobot_version: "v2.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
