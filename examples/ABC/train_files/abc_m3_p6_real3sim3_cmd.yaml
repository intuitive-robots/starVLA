# ABC-130K real + ABC-130K-sim co-training (2026-10-07), upstream ABC protocol: real 81.72% / sim 18.28% per sample
# (abc_minimal/config.py MIXTURE_PRESETS "bottles"), sim episodes prompted "sim " + task prompt (abc_sim README
# "Prompt defaults"). Copy of abc_m3_p6_real3_cmd.yaml; ONLY the data keys differ: m3_data_config (real roots unchanged +
# ABC-130k-sim wrist_fov58/train put bottles / dish rack / mug; throw left out as upstream), m3_norm_stats_dir (real
# stats copied unchanged + abc130k_sim_yam_fov58_cmd), m3_instruction_map (sim prompts = "sim " + our real wording),
# data_mix label, open-loop subdatasets (one per task, 4 real + 3 sim).
# ABC-130K (real, commanded actions) on the P6 converted encoder through the m3_data bridge.
# Copy of examples/LIBERO/train_files/ervla_v5_gr00t_state_enc_v3_b32.yaml with only the ABC changes:
# m3 loader (3 tasks / 19 roots: bottles put+throw, dish rack, mug flip), 14-D bimanual YAM actions in
# 30-step chunks at 30 Hz (ABC's own chunk), 14 state tokens, 3 cameras, no open-loop eval.
datasets:
  vla_data:
    action_horizon: 30
    augmentation: crop_photometric
    dataset_py: m3_data_datasets
    data_mix: m3_abc_real3_sim3_cmd
    drop_last: true
    include_state: true
    num_workers: 32
    per_device_batch_size: 8
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 4
    seed: 42
    video_backend: null
    m3_data_config: /e/scratch/m3/blank4/abc/m3cfg/abc_real3_sim3_cmd_local.json
    m3_norm_stats_dir: /e/scratch/m3/blank4/abc/m3cfg/norm_stats_real3_sim3_cmd
    m3_instruction_map:   # sim episodes only (strict); these strings are the ABC-Sim eval prompts
      abc130k_sim_yam_fov58_cmd:
        "put the plastic bottles in the bin": "sim put the plastic bottles in the bin"
        "load plates into tabletop dish rack": "sim load the plates into the dish rack"
        "turn mug right side up": "sim turn the mug right side up"
    m3_open_loop_subdatasets:   # trainer.open_loop_eval: one subdataset per task (largest real root) + the 3 sim roots
    - d405_640x480_60hz_h264_nopose/put_the_plastic_bottles_in_the_bin__d405_640x480_60hz_h264_nopose
    - zedx_1920x1200_30hz_h265_nopose/throw_the_plastic_bottles_in_the_bin__zedx_1920x1200_30hz_h265_nopose
    - d405_640x480_30hz_h264_pose/load_the_plates_into_the_dish_rack__d405_640x480_30hz_h264_pose
    - zedx_1920x1200_30hz_h265_nopose/turn_the_mug_right_side_up__zedx_1920x1200_30hz_h265_nopose
    - put_plastic_bottles_in_bin
    - load_plates_into_dish_rack
    - turn_mug_right_side_up
    m3_cache_root: /e/scratch/m3/blank4/abc/m3cfg/processed_cache
    m3_letterbox: true   # ABC: non-square cameras letterboxed to 224x224 (paper); undoes m3's square stretch
    m3_camera_order:
    - camera_head
    - camera_wrist_left
    - camera_wrist_right
    round_robin_dataloader: true
  vlm_data:
    base_interval: 2
    data_flatten: false
    dataformat: llava_json
    dataset_py: vlm_datasets
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    num_workers: 4
    per_device_batch_size: 4
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 2
framework:
  action_model:
    action_dim: 14
    action_hidden_dim: 768
    action_horizon: 30
    action_model_type: DiT-B
    add_pos_embed: true
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 12
      output_dim: 768
      positional_embeddings: null
    future_action_window_size: 29
    hidden_size: 768
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    num_timestep_buckets: 1000
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    state_dim: 0
    token_state_dim: 14
  choice_policy:
    enabled: false
    location: encoder
    num_choices: 5
  name: QwenGR00T
  qwenvl:
    attn_implementation: flash_attention_3
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    cross_attention_gate_init: 0.1
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    layerwise_decoder_cross_attention: false
    separate_cross_attention: true
    skip_decoder: true
    use_merged_attention: false
    vl_hidden_dim: 2048
  readout_tokens:
    dropout: 0.0
    enabled: false
    ffn_dim: 0
    num_heads: 8
    num_layers: 2
    num_tokens: 32
  state_token_mode: reserved_ids
  state_routing: token_only
  state_num_bins: 256
  state_token_source: rare_real
  trainable_bin_embedding: false
is_debug: false
run_id: abc_m3_p6_real3sim3_cmd
run_root_dir: playground/Checkpoints
seed: 42
trainer:
  eval_interval: 1000
  # cross_attn_adapters frozen as in the RoboCasa P6 configs: decoder-side, never executed with skip_decoder (352M params,
  # no gradient); this makes P6 trainable ~2245M = P2 2244M
  freeze_modules: qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.cross_attn_adapters,qwen_vl_interface.model.model.language_model.decoder_embed_tokens,qwen_vl_interface.model.model.language_model.decoder_norm,qwen_vl_interface.model.lm_head
  full_state_save_total_limit: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  gradient_clipping: 1.0
  learning_rate:
    action_model: 0.0001
    base: 2.5e-05
    qwen_vl_interface: 3.0e-05  # ABC: 3x the LIBERO recipe (larger batch, new embodiment); head and base unchanged
  logging_frequency: 100
  loss_scale:
    vla: 1.0
    vlm: 0.1
  lr_scheduler_type: cosine_with_min_lr
  max_grad_norm: 1.0
  max_train_steps: 30000
  num_warmup_steps: 1000
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    name: AdamW
    weight_decay: 1.0e-08
  save_full_training_state: true
  save_interval: 5000
  save_total_limit: 1
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  weight_decay: 0.0
  open_loop_eval: false
use_deepspeed: true
version_id: '0.21'
wandb_entity: niblank
wandb_project: starvla_libero
