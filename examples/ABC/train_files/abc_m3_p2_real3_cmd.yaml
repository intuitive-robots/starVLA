# ABC-130K (real, commanded actions) on P2 (causal Qwen3-VL-2B with the same VLM pretraining as P6) through the m3_data bridge.
# Matched counterpart of abc_m3_p6_real3_cmd.yaml: only the backbone keys differ (as LIBERO ervla_v5_gr00t_state_causal_v3_b32.yaml
# vs ..._enc_v3_b32.yaml), plus the pretrained causal checkpoint baked in (the bare causal yaml defaults to plain Qwen).
# Copy of examples/LIBERO/train_files/ervla_v5_gr00t_state_enc_v3_b32.yaml with only the ABC changes:
# m3 loader (3 tasks / 19 roots: bottles put+throw, dish rack, mug flip), 14-D bimanual YAM actions in
# 30-step chunks at 30 Hz (ABC's own chunk), 14 state tokens, 3 cameras, no open-loop eval.
datasets:
  vla_data:
    action_horizon: 30
    augmentation: crop_photometric
    dataset_py: m3_data_datasets
    data_mix: m3_abc_real3_cmd
    drop_last: true
    include_state: true
    num_workers: 32
    per_device_batch_size: 8
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 4
    seed: 42
    video_backend: null
    m3_data_config: /e/scratch/m3/blank4/abc/m3cfg/abc_real3_cmd_local.json
    m3_norm_stats_dir: /e/scratch/m3/blank4/abc/m3cfg/norm_stats_real3_cmd
    m3_cache_root: /e/scratch/m3/blank4/abc/m3cfg/processed_cache
    m3_letterbox: true   # ABC: non-square cameras letterboxed to 224x224 (paper); undoes m3's square stretch
    m3_camera_order:
    - camera_head
    - camera_wrist_left
    - camera_wrist_right
    round_robin_dataloader: true
  vlm_data:
    base_interval: 2
    data_flatten: false
    dataformat: llava_json
    dataset_py: vlm_datasets
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    num_workers: 4
    per_device_batch_size: 4
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 2
framework:
  action_model:
    action_dim: 14
    action_hidden_dim: 768
    action_horizon: 30
    action_model_type: DiT-B
    add_pos_embed: true
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 12
      output_dim: 768
      positional_embeddings: null
    future_action_window_size: 29
    hidden_size: 768
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    num_timestep_buckets: 1000
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    state_dim: 0
    token_state_dim: 14
  choice_policy:
    enabled: false
    location: encoder
    num_choices: 5
  name: QwenGR00T
  qwenvl:
    attn_implementation: flash_attention_3
    base_vlm: /e/project1/m3/blank4/code/train_downstream/train/outputs/insight_cp1_q3vl2b_causal_v5/2026-09-22_18-02-59_job1955957/checkpoints/checkpoint-28786
    vlm_impl: qwen3
    enc_dec: false
    vl_hidden_dim: 2048
  readout_tokens:
    dropout: 0.0
    enabled: false
    ffn_dim: 0
    num_heads: 8
    num_layers: 2
    num_tokens: 32
  state_token_mode: reserved_ids
  state_routing: token_only
  state_num_bins: 256
  state_token_source: rare_real
  trainable_bin_embedding: false
is_debug: false
run_id: abc_m3_p6_real3_cmd
run_root_dir: playground/Checkpoints
seed: 42
trainer:
  eval_interval: 1000
  freeze_modules: ''   # nothing frozen (as LIBERO P2): Qwen3-VL ties lm_head to embed_tokens
  full_state_save_total_limit: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  gradient_clipping: 1.0
  learning_rate:
    action_model: 0.0001
    base: 2.5e-05
    qwen_vl_interface: 3.0e-05  # ABC: 3x the LIBERO recipe (larger batch, new embodiment); head and base unchanged
  logging_frequency: 100
  loss_scale:
    vla: 1.0
    vlm: 0.1
  lr_scheduler_type: cosine_with_min_lr
  max_grad_norm: 1.0
  max_train_steps: 30000
  num_warmup_steps: 1000
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    name: AdamW
    weight_decay: 1.0e-08
  save_full_training_state: true
  save_interval: 5000
  save_total_limit: 1
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  weight_decay: 0.0
  open_loop_eval: false
use_deepspeed: true
version_id: '0.21'
wandb_entity: niblank
wandb_project: starvla_libero
