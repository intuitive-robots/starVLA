run_id: droid_resized_qwenpi_v3
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_real_robot
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3.5-4B
    attn_implementation: flash_attention_3 #sdpa
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024     # Matches the final DiT projection, used by the ActionDecoder
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 8
    state_dim: 8
    action_horizon: 20

    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 16
    diffusion_model_cfg:    # Parameters for the DiT transformer
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 32



datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: false

  vla_data:
    dataset_py: marigold_data_datasets # full marigold_data InfiniteDataReader path
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/DROID/
    data_mix: droid_lerobot_resized_success #libero_all # libero_goal
    action_type: abs_qpos
    action_mode: abs
    use_keep_ranges: true
    filter_successful_trajectories: true
    success_indicator_key: stats/is_episode_successful/min
    filter_nonempty_language: true
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    target_fps: 15
    video_backend: torchcodec
    marigold_video_backend: torchcodec
    marigold_sharding_plan_cache_root: /e/home/jusers/blank4/jupiter/blank4/cache/marigold_sharding
    marigold_instruction_mode: local
    marigold_normalize_q99: true
    marigold_norm_stats_path: /e/home/jusers/blank4/jupiter/blank4/cache/norm_stats_droid_resized_success/franka_robotiq_gripper.json
    marigold_camera_decode_groups:
      - [camera_external_left, camera_external_right]
      - [camera_wrist]
    marigold_camera_groups:
      - [camera_external_left, camera_external_right]
      - [camera_wrist]
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 1
    persistent_workers: true
    pin_memory: true
    worker_torch_num_threads: 1
    include_state: true
    obs_image_size: [180, 320]
    sample_language: true
    sample_video_groups:
      - [video.exterior_1_left, video.exterior_2_left]


trainer:
  max_train_steps: 100000
  num_warmup_steps: 1000
  save_interval: 5000
  save_total_limit: 4
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''  #'qwen_vl_interface'
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
