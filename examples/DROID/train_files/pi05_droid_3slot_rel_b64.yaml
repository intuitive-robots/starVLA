# pi0.5 (PI05) DROID fine-tune v2 (2026-10-11), revised from pi05_droid_2cam_rel_b64.yaml to follow pi0.5-DROID's
# own training inputs and ARC (arXiv 2610.12386, App. D: pi0.5-DROID full fine-tune, LR 1e-5, AdamW b2 0.95, 1k
# warm-up then constant, 3 camera slots with the third masked). Init: openpi pi05_droid_jointpos converted to starVLA
# (/e/scratch/m3/blank4/pi05_droid/pi05_droid_starvla). This yaml is the CONTROL; the E7f arm adds the RoboTwin
# $E7FPI flags (views [external, wrist], fusion layer 10 of 18, camera dropout on slots [0, 1] only), see
# /e/scratch/m3/blank4/pi05_droid/submit_droid_v2_20261011.sh. Changes vs v1:
#
#  * 3 image slots as openpi DroidInputs: base_0_rgb = exterior, left_wrist_0_rgb = wrist, right_wrist_0_rgb = a
#    black image with image mask False (the framework pads slots the loader does not fill and masks them: their
#    tokens are never attended, exactly openpi's padded slot). 180x320 frames letterboxed to 224 (resize_with_pad).
#  * data: droid_resized_success (74,604 success episodes, 17.76M frames, 180x320 AV1, ~ARC's 74.7k labelled
#    episodes) through the gr00t loader (decord decodes the AV1 streams) and the view droid_resized_success_pi05
#    (keep_ranges = openpi's idle filter). As openpi's DROID loader: the exterior camera is exterior_1_left or
#    exterior_2_left at random (sample_video_groups), the instruction one of the three phrasings at random
#    (sample_language); eval mode takes exterior_1_left and the first phrasing.
#  * one LR for every group: 1e-5 (v1: PaliGemma 1e-5, action expert 1e-4, rest 2.5e-5). No EMA (the trainer has
#    no weight EMA).
#  * unchanged: state as 256-bin digits in the prompt (q99, openpi stats), horizon 16, joints relative to s_0 +
#    absolute gripper (openpi DeltaActions), openpi norm stats (stats_override_path), crop_photometric in the
#    workers, global batch 64.
run_id: pi05_droid_v2_ctrl_s42
run_root_dir: /e/scratch/m3/blank4/pi05_droid/checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_droid_pi05
is_debug: false

framework:
  name: PI05
  precision: bfloat16
  action_dim: 32
  action_horizon: 16
  max_state_dim: 32
  discrete_state_input: true
  discrete_state_mode: starvla
  state_token_mode: text
  state_num_bins: 256
  max_token_len: 200
  # openpi DROID inference default (10 Euler steps); LIBERO used 4
  num_inference_steps: 10
  image_resolution:
  - 224
  - 224
  # openpi DroidInputs: the third slot is padded (black, image mask False) by the framework
  image_keys:
  - base_0_rgb
  - left_wrist_0_rgb
  - right_wrist_0_rgb
  # the padded slot is masked in every row: leave it out of the prefix (exact, see PI0._n_active_slots); without this
  # the E7f arm runs out of memory at per-device batch 16 and every step pays a third SigLIP pass
  elide_masked_image_slots: true
  train_forward: split
  repeated_diffusion_steps: 8
  action_loss_dims: 8
  output_action_dim: 8
  tokenizer:
    model_path: /e/scratch/m3/blank4/hf_pi_model_starvla/tokenizer/paligemma_tokenizer.model
    pad_state_value: -2.0
    extra_pythonpath: /e/scratch/m3/blank4/pylibs_openpi
  paligemma:
    model_name_or_path: ''
  action_model:
    action_horizon: 16
  # read only by train_starvla.log_eval_backend_banner (assumes a Qwen backbone)
  qwenvl:
    attn_implementation: sdpa
  modality_dropout:
    enabled: false
  fusion_registers:
    enabled: false
  future_copies:
    enabled: false
  state_dropout_rate: 0.0
  state_dropout_mask: false
  instruction_dropout_rate: 0.0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /e/scratch/m3/blank4/pi05_droid/data
    data_mix: droid_pi05_resized
    lerobot_version: v3.0
    action_horizon: 16
    action_type: relative_qpos
    action_mode: rel
    action_mode_apply_keys:
    - action.joint_position
    action_mode_state_map:
      action.joint_position: state.joint_position
    stats_override_path: /e/scratch/m3/blank4/pi05_droid/stats/stats_override_openpi_droid_jointpos_resized.json
    include_state: true
    # the DROID config always q99-normalises the state; the marker tells the policy server the contract
    state_normalization: q99
    state_normalization_applied: true
    use_keep_ranges: true
    filter_nonempty_language: true
    # openpi's DROID loader: one of the three phrasings, exterior_1_left or exterior_2_left, at random
    sample_language: true
    sample_video_groups:
    - [video.exterior_1_left, video.exterior_2_left]
    augmentation: crop_photometric
    # keep the stored 180x320 frames: the framework letterboxes them to 224 (openpi resize_with_pad). Without this
    # key a fresh lerobot_datasets run defaults to pack_image_size [224, 224], a plain resize that squashes 16:9 to 1:1.
    pack_image_size: null
    holdout_trajectories_per_dataset: 0
    holdout_trajectories_per_task: 0
    video_backend: decord
    sequential_step_sampling: false
    load_all_data_for_training: true
    per_device_batch_size: 16
    drop_last: true
    num_workers: 16
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    seed: 42

trainer:
  pretrained_checkpoint: /e/scratch/m3/blank4/pi05_droid/pi05_droid_starvla/bfloat16/model.safetensors
  eval_interval: 1000
  # no held-out trajectories (holdout 0): the periodic eval is the train-batch action MSE only
  open_loop_eval: false
  # unused in the pi0.5 graph: the action expert's LM head (263M) and the PaliGemma final norm
  freeze_modules: action_head.gemma_expert.lm_head,vlm.model.model.language_model.norm
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  gradient_clipping: 1.0
  # ARC / openpi pi0.5-DROID fine-tune: 1e-5 for every parameter group
  learning_rate:
    action_head: 1.0e-05
    base: 1.0e-05
    vlm: 1.0e-05
  logging_frequency: 100
  loss_scale:
    vla: 1.0
    structured_aux: 0.05
  lr_scheduler_type: cosine_with_min_lr
  max_grad_norm: 1.0
  max_train_steps: 50000
  num_warmup_steps: 1000
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    name: AdamW
    weight_decay: 1.0e-08
  save_full_training_state: true
  save_interval: 5000
  save_total_limit: 1
  full_state_save_total_limit: 1
  delete_training_state_on_finish: false
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  weight_decay: 0.0
  is_resume: false
use_deepspeed: true
