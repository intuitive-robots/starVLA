# Primary cross-embodiment DROID recipe using the original droid_success tables
# and the 180x320 transcoded video copy.
#
# Action semantics (7-D):
#   action.cartesian_velocity       -- relative EEF xyz + quaternion converted
#                                      worker-side to xyz + shortest axis-angle
#   1-action.gripper_position[0]    -- absolute gripper, 1=open and 0=closed
# State semantics (7-D): absolute EEF xyz/rpy + inverted absolute gripper,
# also 1=open and 0=closed. This matches LIBERO's binary_invert convention.
# Images/state at frame t predict controller actions t .. t+19.
run_id: droid_success_180x320_delta_eef_state_gr00t_qwen3vl2b_causal
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_real_robot
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    # Stock decoder-only Qwen3-VL: causal self-attention, not the LIBERO-specific
    # mask-finetuned tail and not the encoder-decoder conversion.
    enc_dec: false
    attn_implementation: flash_attention_3
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 20

    diffusion_model_cfg:
      dropout: 0.2
      num_layers: 16
      output_dim: 1024

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: false

  vla_data:
    action_horizon: 20
    dataset_py: marigold_data_datasets
    # Original droid_success tables plus the newly transcoded 180x320 videos.
    data_root_dir: /e/scratch/m3/datasets/lerobot_3_0_transcoded/DROID/
    data_mix: droid_lerobot_180x320_delta_eef
    action_type: delta_eef
    action_mode: delta
    action_dim: 7
    state_dim: 7
    marigold_action_representation: delta_eef_abs_gripper
    use_keep_ranges: true
    # droid_success is already the success-only release.
    filter_successful_trajectories: false
    filter_nonempty_language: true
    sequential_step_sampling: false
    #CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    # With four 4-GPU nodes this is 32/GPU x 16 GPUs = 512 global before any
    # gradient accumulation. Powers of two are not required by the loader.
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    target_fps: 15
    video_backend: torchcodec
    marigold_video_backend: torchcodec
    marigold_sharding_plan_cache_root: /e/home/jusers/blank4/jupiter/blank4/cache/marigold_sharding
    marigold_instruction_mode: local
    marigold_normalize_q99: true
    # q01/q99 statistics computed from droid_success after quaternion-to-axis-angle
    # conversion, matching NaiveDROIDDeltaEEFAbsGripperSampler exactly.
    marigold_norm_stats_path: /e/project1/m3/blank4/code/encdec-vlm/train/encoder_decoder_training/enc_dec_cot/mappings/droid_delta_eef_stats.json
    marigold_camera_decode_groups:
      - [camera_external_left, camera_external_right]
      - [camera_wrist]
    marigold_camera_groups:
      - [camera_external_left, camera_external_right]
      - [camera_wrist]
    lerobot_version: "v3.0"
    # Retain the best worker settings from the 720p benchmark (job 1606548).
    # The transcoded input removes decoder-side 720p scaling work.
    num_workers: 24
    prefetch_factor: 4
    # Match marigold_train/m3_data production: workers return singleton
    # samples and batches are assembled in each rank's main process.
    round_robin_dataloader: true
    persistent_workers: true
    pin_memory: true
    worker_torch_num_threads: 1
    include_state: true
    # The stored H.264 streams already have this exact resolution.
    obs_image_size: [180, 320]
    augmentation: crop_photometric
    sample_language: true

trainer:
  max_train_steps: 100000
  # Initial launch starts from scratch when no checkpoint exists; subsequent
  # launches with the same run_id automatically select the latest step file.
  is_resume: true
  num_warmup_steps: 3000
  save_interval: 20000
  save_total_limit: 4
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
