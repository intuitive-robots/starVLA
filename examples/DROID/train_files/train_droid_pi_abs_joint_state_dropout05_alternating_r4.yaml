# Corrected PI-v3 absolute-joint experiment with alternating temporal
# self-attention and four flow-noise draws. State is retained at inference and
# independently omitted from 50% of training prompts.
run_id: droid_pi_abs_joint_causal_altattn_r4_bs256_100k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_real_robot
wandb_group: droid_pi_altattn_r4_bs256
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  state_dropout_rate: 0.5
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: false
    collect_encoder_layers: true
    attn_implementation: flash_attention_3
    vl_hidden_dim: 2048
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 8
    state_dim: 0
    action_horizon: 16
    add_pos_embed: true
    max_seq_len: 1024
    repeated_diffusion_steps: 4
    num_inference_timesteps: 10
    num_target_vision_tokens: 0
    layerwise_attention_layout: alternating
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: true
      norm_type: ada_norm
      attention_head_dim: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: false
  vla_data:
    action_horizon: 16
    dataset_py: marigold_data_datasets
    data_root_dir: /e/scratch/m3/datasets/lerobot_3_0_transcoded/DROID/
    data_mix: droid_lerobot_180x320_joint_pos
    action_type: abs_qpos
    action_mode: abs
    action_dim: 8
    state_dim: 8
    marigold_action_representation: joint_position_abs_gripper
    marigold_invert_gripper: true
    use_keep_ranges: true
    filter_successful_trajectories: false
    filter_nonempty_language: true
    sequential_step_sampling: false
    target_fps: 15
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    video_backend: torchcodec
    marigold_video_backend: torchcodec
    marigold_sharding_plan_cache_root: /e/home/jusers/blank4/jupiter/blank4/cache/marigold_sharding
    marigold_instruction_mode: local
    marigold_normalize_q99: true
    marigold_norm_stats_path: /e/project1/m3/blank4/code/m3_model/norm_stats/franka_robotiq_gripper.json
    marigold_camera_decode_groups:
      - [camera_external_left, camera_external_right]
      - [camera_wrist]
    marigold_camera_groups:
      - [camera_external_left, camera_external_right]
      - [camera_wrist]
    lerobot_version: "v3.0"
    num_workers: 24
    prefetch_factor: 4
    round_robin_dataloader: true
    persistent_workers: true
    pin_memory: true
    worker_torch_num_threads: 1
    include_state: true
    obs_image_size: [224, 224]
    augmentation: crop_photometric
    sample_language: true

trainer:
  max_train_steps: 100000
  open_loop_eval: true
  open_loop_num_episodes_per_subdataset: 10
  open_loop_batch_size: 8
  open_loop_max_anchors: null
  is_resume: false
  num_warmup_steps: 3000
  save_interval: 20000
  save_total_limit: 4
  save_full_training_state: true
  full_state_save_total_limit: 2
  eval_interval: 5000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
