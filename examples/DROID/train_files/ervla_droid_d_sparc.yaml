# DROID grounded ERVLA arm using the compact SPARC release mapping.
# cam1 is sampled uniformly from the annotated left/right external cameras. The
# wrist camera is the second policy input and receives no fabricated grounding.
run_id: ervla_droid_d_sparc
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_droid_ervla
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_t097_fsd_rp_llov2/2026-06-12_01-49-02/checkpoints/checkpoint-9056
    skip_decoder: false
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    # Delta EEF xyz/axis-angle + absolute gripper (1=open), conditioned on
    # absolute EEF xyz/axis-angle + absolute gripper state.
    action_dim: 7
    state_dim: 7
    action_horizon: 20
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 16
      output_dim: 1024
      dropout: 0.2

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 20
    dataset_py: marigold_data_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/DROID
    data_mix: droid_lerobot_delta_eef
    action_type: delta_eef
    action_mode: delta
    action_dim: 7
    state_dim: 7
    marigold_action_representation: delta_eef_abs_gripper
    use_keep_ranges: true
    filter_nonempty_language: true
    sequential_step_sampling: false
    target_fps: 15
    per_device_batch_size: 16
    drop_last: true
    load_all_data_for_training: true
    video_backend: torchcodec
    marigold_video_backend: torchcodec
    marigold_sharding_plan_cache_root: /e/home/jusers/blank4/jupiter/blank4/cache/marigold_sharding
    marigold_instruction_mode: local
    marigold_normalize_q99: true
    marigold_norm_stats_path: /e/project1/m3/blank4/code/encdec-vlm/train/encoder_decoder_training/enc_dec_cot/mappings/droid_delta_eef_stats.json
    marigold_camera_keys:
      - camera_external_left
      - camera_external_right
      - camera_wrist
    marigold_camera_decode_groups:
      - [camera_external_left, camera_external_right]
      - [camera_wrist]
    marigold_camera_groups:
      - [camera_external_left, camera_external_right]
      - [camera_wrist]
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 1
    persistent_workers: true
    pin_memory: true
    worker_torch_num_threads: 1
    include_state: true
    obs_image_size: [180, 320]
    augmentation: crop_photometric
    sample_language: true
    CoT_prompt: "Your task is {instruction}. Describe the current subtask and motion. Ground the relevant object and target in cam1 and give its future image trajectory."
    cot:
      source: sparc_sqlite
      mapping_path: /e/project1/m3/blank4/code/encdec-vlm/train/encoder_decoder_training/enc_dec_cot/mappings/droid_sparc_cot.sqlite
      camera_key_to_view:
        camera_external_left: observation.images.left_external
        camera_external_right: observation.images.right_external
      variant_mode: random
      variant_seed: 42
      require_rewrite: true
      min_selection_score: 0.94
      motion_cache_size: 16
      dropout_enabled: true
      dropout_rate: 0.5

trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
    cot: 0.5
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
