# ERVLA-style auxiliary reasoning decoder -- ARM B: bidirectional encoder, no reasoning target
#
# Matrix (TODO.md "Auxiliary reasoning decoder (ERVLA)"; plan: moonlit-herding-kernighan.md)
#   A  causal encoder,        no reasoning target
#   B  bidirectional encoder, no reasoning target
#   C  + subtask / movement / point-trajectory
#   C-rand  same format, another episode's annotation           <- falsifiability control
#   D  + grounded object box, target point, physical reasoning
#   E  = D, decoder core frozen for 2k steps then 0.1x LR
#
# SHARED VLABench RECIPE -- only the intended B/D/G architecture and CoT fields vary.
#   official primitive post-training split, 20k steps, global batch 64 (16 x 4 GPUs),
#   backbone UNFROZEN. 20000*64/575101 = 2.23 frame passes.
#
# The baseline every reasoning arm is measured against. Bare prompt, no CoT loss;
# the decoder never runs (skip_decoder).
run_id: ervla_vlabench_b_bidir
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_vlabench
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  qwenvl:
    base_vlm:  /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_t097_fsd_rp_llov2/2026-06-12_01-49-02/checkpoints/checkpoint-9056
    skip_decoder: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7          # VLABench absolute robot-frame eef (6) + gripper (1)
    state_dim: 0
    action_horizon: 16
    # Match the resolved stock QwenGR00T head; horizon/state remain experiment choices.
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 16
      output_dim: 1024
      dropout: 0.2

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0
    data_mix: vlabench_primitive
    action_type: absolute_eef
    action_mode: abs
    sequential_step_sampling: False



    per_device_batch_size: 16
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false
    # pi0.5/OpenPI: crop .95 -> resize -> rotate +/-5 deg -> color jitter.
    augmentation: crop_photometric

trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
