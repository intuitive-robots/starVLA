# LIBERO-plus + step-based CoT supervision (point format, selection_mode=detection).
#
# CoT source: data/cot_mappings/libero_plus_detection.jsonl — built from the LIBERO-plus
# annotations with
#   python scripts/create_cot_mapping.py \
#       --annotations ~/datasets/lerobot_3_0/libero_plus_boxes.jsonl \
#       --output      data/cot_mappings/libero_plus.jsonl --all
# (43807 entries / 10514 trajectories). The "ours" counterpart is
# starvla_cotrain_libero_plus_cot_qwen.yaml (selection_mode=ours).
#
# Differences vs starvla_cotrain_libero_plus_base_qwen.yaml:
#   - framework QwenOFT -> QwenGR00T_CoT  (only QwenGR00T / QwenGR00T_CoT build a
#     cot_resolver; QwenOFT has no CoT path at all)
#   - action head MLP -> DiT (flow matching), as in the real-robot CoT trace config
#   - adds datasets.vla_data.cot + trainer.loss_scale.cot
run_id: libero_plus_qwen08b_cot_det
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero_plus
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_CoT
  cot:
    generate_at_inference: false
    max_new_tokens: 160

  readout_tokens:
    enabled:    false
    num_tokens: 32
    num_layers: 2
    num_heads:  8
    ffn_dim:    0
    dropout:    0.0

  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3.5-0.8B
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7          # LIBERO delta eef (6) + gripper (1)
    state_dim: 0
    action_horizon: 8
    action_model_type: DiT-B
    hidden_size: 768
    action_hidden_dim: 768
    add_pos_embed: True
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      dropout: 0.1

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0
    data_mix: libero_plus
    action_type: delta_qpos
    sequential_step_sampling: False

    # MUST match the human prompt baked into the mapping file, or
    # assert_cot_prompt_consistent() fails at startup. This is the point-format
    # default prompt create_cot_mapping.py writes without --box_format/--trace_format.
    CoT_prompt: "Your task is {instruction}. What is the next subtask? Point to the target location."

    cot:
      source: mapping
      mapping_path: data/cot_mappings/libero_plus_detection.jsonl
      loss_scale: 0.1

    per_device_batch_size: 32
    load_all_data_for_training: true
    video_backend: torchcodec
    # See base config: per-worker LRU of open decord readers. Without it, LIBERO-plus's
    # 200 MB AV1 files are re-opened and re-indexed per sample (~1 step in 8 stalls
    # 15-27 s). Applies to decord and torchcodec; 0 disables.
    # See starvla_cotrain_libero_plus_base_qwen.yaml for the measurements behind these.
    video_seek_mode: approximate
    video_num_threads: 1
    video_reader_cache_size: 80
    # See starvla_cotrain_libero_plus_base_qwen.yaml for why this matters on NFS.
    video_prefetch_page_cache: true
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
    cot: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
