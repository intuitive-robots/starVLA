# gr00t_deeps recipe (best LIBERO-plus run at the full 1000-episode protocol,
# 0.772 mean / 0.750 libero_10) with the backbone swapped for the ENCODER ONLY
# of the recent Qwen3.5 enc-dec run in ../train_downstream. Everything else --
# data mixture, DiT-B action head, horizon, schedule, LRs -- is unchanged from
# the deeps config so the backbone is the only variable.
# Plain GR00T (no CoT) on LIBERO-plus -- rerun of libero_plus_qwen08b_gr00t
# to a fresh checkpoint dir. NOTE: DeepSpeed is a property of the LAUNCHER,
# not of this file -- see train_libero_slurm.sh. Nothing here turns it on.
# LIBERO-plus + GR00T DiT action head, no CoT supervision.
#
# GR00T counterpart of starvla_cotrain_libero_plus_base_qwen.yaml: same dataloading
# and base_vlm, but framework QwenOFT -> QwenGR00T (DiT-B flow-matching head instead
# of the plain MLP). For the CoT-supervised variants (trace prompt + cot_resolver),
# see starvla_cotrain_libero_plus_gr00t_cot_trace_ours_qwen.yaml /
# starvla_cotrain_libero_plus_gr00t_cot_trace_det_qwen.yaml.
run_id: libero_plus_q35encdec_enconly_gr00t_deeps
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero_plus
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    # Qwen3.5-2B, NOT the 0.8B that gr00t_deeps uses: the enc-dec checkpoint was
    # trained from Qwen3.5-2B (hydra model_id) and its text_config is
    # hidden_size 2048 / 24 layers, which matches 2B (0.8B is hidden 1024).
    # Loading it onto a 0.8B base would not work. This means the run differs
    # from gr00t_deeps in model SIZE as well as backbone type -- unavoidable,
    # since the encoder we have is 2B.
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3.5-2B
    # No readout_tokens block, matching gr00t_deeps: with readout_projector
    # unset, QwenGR00T cross-attends the DiT directly to the full last hidden
    # states (dit_context = last_hidden, masked by dit_attention_bias). That is
    # what the best run does, so the backbone stays the only variable.
    #
    # Encoder ONLY from the Qwen3.5 enc-dec run: skip_decoder drops the decoder
    # half, exactly as the Qwen3-VL v5 setup does. Checkpoint config reports
    # model_type qwen3_5, Qwen35EncDecForConditionalGeneration,
    # text_config hidden_size 2048 / num_hidden_layers 24 -- hence
    # vl_hidden_dim 2048 and num_vl_layers 24 (NOT the 28 the 2B Qwen3-VL uses).
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/q35_enc_dec_v5_tb18432/2026-09-15_00-20-14_job1776705/checkpoints/checkpoint-28786
    skip_decoder: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    num_vl_layers: 24
    # false, matching how THIS checkpoint was trained: the q35 hydra config
    # sets neither use_merged_attention nor use_dec_only_merged, unlike the
    # Qwen3-VL v5 enc-dec which used both plus n_encoder_layers: 14.
    use_merged_attention: false
    # false, like every other skip_decoder config in the repo. It installs per-layer
    # decoder->encoder attention, so with skip_decoder: true nothing ever uses it --
    # and its init copies layer.self_attn.{q,k,v,o}_proj into the adapters, which
    # crashes on Qwen3.5: that backbone is hybrid, and its linear_attention layers
    # carry `linear_attn` (a gated DeltaNet), not `self_attn`.
    #   AttributeError: 'Qwen3_5DecoderLayer' object has no attribute 'self_attn'
    separate_cross_attention: false
    cross_attention_gate_init: 0.1
  action_model:
    action_dim: 7          # LIBERO delta eef (6) + gripper (1)
    state_dim: 0
    action_horizon: 8
    action_model_type: DiT-B
    hidden_size: 768
    action_hidden_dim: 768
    add_pos_embed: True
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      dropout: 0.1

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0
    data_mix: libero_plus
    action_type: delta_qpos
    sequential_step_sampling: False

    per_device_batch_size: 32
    load_all_data_for_training: true
    video_backend: torchcodec
    # See starvla_cotrain_libero_plus_base_qwen.yaml for the measurements behind these.
    video_seek_mode: approximate
    video_num_threads: 1
    video_reader_cache_size: 80
    video_prefetch_page_cache: true
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
