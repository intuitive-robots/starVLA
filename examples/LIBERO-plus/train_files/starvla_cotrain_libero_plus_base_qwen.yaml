run_id: libero_plus_qwen08b_base
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero_plus
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm:  /e/scratch/m3/misc_data/nogga2/weights/Qwen3.5-0.8B
    attn_implementation: sdpa #sdpa #flash_attention_3
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 8

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    dataset_py: lerobot_datasets
    # LIBERO-plus lives at <data_root_dir>/libero_plus (data/ meta/ videos/ at top
    # level), so data_root_dir is the PARENT dir. Mixture "libero_plus" is defined in
    # examples/LIBERO-plus/train_files/data_registry/data_config.py and reuses the
    # libero_franka DataConfig (incl. action.gripper: binary_invert).
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0
    data_mix: libero_plus
    action_type: delta_qpos
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 32
    load_all_data_for_training: true
    # torchcodec, not decord. LIBERO-plus packs ~380 episodes into each of 76
    # 200 MB / 58k-frame AV1 files, so cost is dominated by opening a reader, not
    # by decoding the one frame you want. Per-reader open cost on a booster node:
    #     decord, default threads  2789 ms   +33 threads   +808 MB   <- the stall
    #     decord, num_threads=1     127 ms    +1 thread      +1 MB
    #     torchcodec seek exact     126 ms
    #     torchcodec seek approx      2.8 ms   0 threads      0 MB   <- what we use
    # decord sizes a decode thread pool per reader from the host core count (288
    # here); that pool, not the decoding, is what cost seconds per open and made
    # the job OOM. torchcodec with seek_mode=approximate skips the full-container
    # index scan that "exact" performs, and is what the marigold LeRobot fork uses.
    # End-to-end on this dataset, 60 samples steady state after warm-up:
    #     decord nt=1, cache= 8   423.2 ms/sample   0.55 GB/worker   8 threads
    #     decord nt=1, cache=80    74.4 ms/sample   4.40 GB/worker  66 threads
    #     torchcodec,  cache= 0    78.0 ms/sample   0.44 GB/worker   0 threads
    #     torchcodec,  cache=80    70.1 ms/sample   0.01 GB/worker   0 threads
    # Verified pixel-identical to decord (0 mismatches over 30 samples x 2 cameras).
    video_backend: torchcodec
    video_seek_mode: approximate
    # One frame per camera per sample (observation_indices == [0]), so a decode
    # thread pool buys nothing. Raise only if you widen the observation window.
    video_num_threads: 1
    # Per-worker LRU of open readers. With torchcodec this is a minor tweak
    # (78 -> 70 ms) rather than the 6x it was for decord, and it is essentially
    # free in memory, so keep it covering all 76 files. 0 disables.
    video_reader_cache_size: 80
    # Warm each mp4 into the OS page cache the first time a worker opens it
    # (one sequential ~0.25s read per 200 MB file, measured at ~830 MB/s off
    # this NFS mount; the full 15 GB set warms in ~20s). Without it every
    # random-frame decode issues scattered small reads over NFS. The page cache
    # is per-node and shared by all workers, so the cost is paid roughly once.
    # Overridable with STARVLA_PREFETCH_MP4=1. Turn off if the node is short on
    # free RAM for page cache.
    video_prefetch_page_cache: true
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''  #'qwen_vl_interface'
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
