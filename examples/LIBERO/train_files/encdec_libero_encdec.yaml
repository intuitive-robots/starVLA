# Tier-3: LIBERO ROLLOUT evaluation of the encdec-vlm backbones.
#
# Tier-1 (frozen probes) and Tier-2 (BC on cached features) are both proxies. Tier-2 found
# the enc-dec architecture helps action prediction (~0.07 mse_cont at 10 demos/task) while
# mask supervision on top of it does not — the OPPOSITE ordering to the frozen probe,
# where mask-FT moved query-free argmax 0.45 -> 0.99 and the plain enc-dec sat at chance.
# Offline MSE cannot settle that. Rollout success can, and it is the metric H1 was written
# against.
#
# These three configs differ ONLY in the backbone. Same data (standard LIBERO, no masks),
# same action expert, same schedule, same seed. The backbone is FROZEN
# (freeze_modules: qwen_vl_interface) so the comparison is about the representation, in
# keeping with Tier-2's design.
#
# ARM: enc-dec (NTP-trained). Tier-2's best offline arm; frozen probe says chance.

run_id: libero_encdec_arm_encdec
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm:  /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_t097_fsd_rp_llov2/2026-06-12_01-49-02/checkpoints/checkpoint-9056
    skip_decoder: true
    attn_implementation: sdpa #sdpa #flash_attention_3
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 16

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed #libero_all # libero_goal
    action_type: delta_qpos
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 32
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    action_horizon: 16


trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: 'qwen_vl_interface'   # frozen: this is a representation comparison
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
