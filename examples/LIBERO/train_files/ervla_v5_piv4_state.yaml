# LIBERO piv4 + proprioceptive state, NO image dropout -- the control for the
# image-dropout family.
#
# Required because the dropout arms carry state and the existing piv4 control does not
# (ervla_v5_piv4_actiononly.yaml: state_dim 0, include_state false). Comparing a
# state+dropout arm against a no-state run changes two things at once and attributes
# neither.
#
# It is also the run that makes the blind arm legible: blind + state is the state-only
# ceiling, and PROBE_INSIGHTS.md line 72 already records causal RoboCasa collapsing from
# 100/144 to 0/144 when the state suffix is removed. Proprioception is load-bearing in
# this codebase; this pair measures how much.
#
# STATE: unlike the no-state control, every arm in this family sets include_state: true /
# state_dim: 8. Proprioception reaches the bidirectional encoder as TEXT --
# Qwen_PI_v3._add_state_conditioning quantises the normalised state into 256 uniform bins
# over [-1,1] and appends "<instruction> [STATE] <bins> [ACTION]" (the pi-0.5 convention,
# share_tools.state2str_transform), and the piv4 head also receives it as a state token.
# A blinded row therefore still carries instruction + state, which is exactly LA4VLA's
# vision-free stage-1 input.
#
# Against the no-state run (1858694) this arm alone answers "does state help at all".
run_id: ervla_v5_piv4_state
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v4
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    skip_decoder: true
    collect_encoder_layers: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    num_vl_layers: 28
    use_merged_attention: false
    separate_cross_attention: true
    cross_attention_gate_init: 0.1
  action_model:
    action_model_type: LayerwiseFM_v4
    action_dim: 7
    state_dim: 8           # LIBERO proprioception (7 joints + gripper)
    action_horizon: 8
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.0
      final_dropout: false
      norm_type: ada_norm
      attention_head_dim: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 8
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: true
    augmentation: crop_photometric

trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 1.0e-06}
  freeze_modules: 'qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.cross_attn_adapters,qwen_vl_interface.model.model.language_model.decoder_embed_tokens,qwen_vl_interface.model.model.language_model.decoder_norm,qwen_vl_interface.model.lm_head'
  loss_scale: {vla: 1.0, vlm: 0.1}
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer: {name: AdamW, betas: [0.9, 0.95], eps: 1.0e-08, weight_decay: 1.0e-08}
