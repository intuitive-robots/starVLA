# MATCHED NULL-TRACE CONTROL. Full training remains gated on the 20-update smoke.
# Four GPUs/run, per-device batch16, effective global batch64.
# This matches predicted-trace compute but supplies constant coordinates to pass2.
# Match upstream StarVLA/NVIDIA GR00T: full final-layer VLM token sequence,
# alternating cross-only and action-self-only DiT blocks, no local query compressor.
run_id: ervla_v5_gr00t_traceloop_2pass_noz_null_all_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: '0.21'
framework:
  name: QwenGR00T_TraceLoop
  readout_tokens:
    enabled: false
    num_tokens: 32
    num_layers: 2
    num_heads: 8
    ffn_dim: 0
    dropout: 0.0
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    skip_decoder: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    num_vl_layers: 28
    use_merged_attention: false
    separate_cross_attention: true
    cross_attention_gate_init: 0.1
    layerwise_decoder_cross_attention: false
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 0
    action_horizon: 16
    hidden_size: 768
    action_hidden_dim: 768
    add_pos_embed: true
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      dropout: 0.1
      cross_attention_dim: 2048
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    future_action_window_size: 15
    past_action_window_size: 0
  trace_loop:
    enabled: true
    num_points: 5
    coordinate_dim: 2
    target_field: trajectory2d
    target_normalization: unit_interval
    slot_token: <|fim_middle|>
    slot_placement: assistant_suffix
    detach_pass2_coordinates: true
    quantization_bins: 1001
    coordinate_embedding:
      type: fourier_mlp
      num_frequencies: 16
      hidden_dim: 512
      add_waypoint_embedding: true
    num_passes: 2
    pass2_source: 'null'
    action_context: all_pass2
    null_trace_embedding: learned_typed_slots
  choice_policy:
    enabled: false
    location: encoder
    num_choices: 5
datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 16
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: v3.0
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false
    augmentation: crop_photometric
