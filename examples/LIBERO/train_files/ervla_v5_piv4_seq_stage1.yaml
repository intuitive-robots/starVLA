# LIBERO piv4 SEQUENTIAL, STAGE 1 -- LIT/APT-style vision-free prior, whole VLM frozen.
#
# The staged counterpart of ervla_v5_piv4_imgdrop_anneal.yaml. Same objective, paid for the
# way the papers pay for it: a separate first stage with its own checkpoint and schedule.
# Running both is the point -- LA4VLA is the only paper that A/B'd staging against mixing
# (sequential 86.75 vs mixed 87.53 on MetaWorld; 96.28 vs 95.75 on LIBERO, i.e. a tie), so
# a sequential-only result would reproduce a known tie and attribute nothing.
#
# The encoder here sees instruction + quantised state and nothing else, which is LA4VLA's
# stage-1 input exactly (they call it "atomic instruction + robot state, without images").
#
# WHAT DIFFERS FROM ervla_v5_piv4_state.yaml
#   removal: tokens      the images never reach the processor, so there are no image tokens
#                        and the vision tower does not run. That is what buys the larger
#                        batch -- and it also shifts where the instruction and state sit
#                        relative to a sighted row, which is exactly why this cannot be
#                        mixed into a batch with sighted rows and must be its own stage.
#   freeze_modules       the WHOLE VLM, encoder + language + vision tower. Only the piv4
#                        head and its projectors train. LIT freezes stage 1 for this
#                        reason: 4k steps of a live 2B encoder adapting to a vision-free
#                        distribution it will never see again is not a prior, it is damage.
#                        NOTE the control's freeze list is NOT this: in full_duplicate
#                        `language_model.layers` is the DECODER (train_starvla.py:1477),
#                        which skip_decoder never runs, so every other arm trains its
#                        encoder at full LR despite the "frozen backbone" comment.
#   batch                32/device x 4 GPUs = 128 global, one seed per node.
#   10,000 steps         10,000 x 128 = 1.28M samples. This is deliberately NOT
#                        sample-matched to the control: stage 2 alone (20,000 x 64 =
#                        1.28M) matches it, and stage 1 is extra pretraining on top. That
#                        is the LIT/APT convention -- APT runs 100k stage-1 iterations
#                        before its stage 2 -- and it is the framing the research question
#                        actually needs: "does a vision-free pretraining phase help?"
#                        The cost is that the arm uses 2x the control's total compute, so
#                        a win supports "vision-free pretraining helps", NOT "staging is
#                        free". A compute-matched reading needs the control at 40k steps.
#                        An earlier 4,000-step stage 1 was total-sample-matched but too
#                        short for a prior to form with the whole VLM frozen.
#   warmup 1000          10% of the stage, the LIBERO convention.
#
# Stage 2 is ervla_v5_piv4_seq_stage2.yaml, which loads this run's steps_10000 checkpoint
# through trainer.pretrained_checkpoint.
run_id: ervla_v5_piv4_seq_stage1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v4
  # ── the only block that differs from ervla_v5_piv4_state.yaml ───────────
  modality_dropout:
    enabled: true
    # Tokens, not pixels: every row is blind in this stage, so there is no sighted row
    # to stay length-comparable with, and dropping the tokens is what makes it cheap.
    removal: tokens
    vision_rate: 1.0
    mode: all
    # In-training eval must be blind too, or it scores a sighted model that does not exist.
    inference_vision_rate: 1.0
    protect_state: true
  # ───────────────────────────────────────────────────────────────────────
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    skip_decoder: true
    collect_encoder_layers: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    num_vl_layers: 28
    use_merged_attention: false
    separate_cross_attention: true
    cross_attention_gate_init: 0.1
  action_model:
    action_model_type: LayerwiseFM_v4
    action_dim: 7
    state_dim: 8           # LIBERO proprioception (7 joints + gripper)
    action_horizon: 8
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.0
      final_dropout: false
      norm_type: ada_norm
      attention_head_dim: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 8
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: true
    augmentation: crop_photometric

trainer:
  max_train_steps: 10000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 1.0e-06}
  # The whole VLM: encoder blocks, decoder blocks, embeddings, norms, lm_head and
  # the vision tower. build_param_lr_groups drops empty groups, so the unused
  # learning_rate.qwen_vl_interface entry below is harmless and is kept so this
  # file stays diffable against the control.
  freeze_modules: 'qwen_vl_interface'
  loss_scale: {vla: 1.0, vlm: 0.1}
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer: {name: AdamW, betas: [0.9, 0.95], eps: 1.0e-08, weight_decay: 1.0e-08}
