# Qwen3.5-0.8B causal conversion checkpoint + OFT action-token MLP head.
# State is routed only through eight pinned VLM token ids; there is no continuous
# action-head bypass. Matched policy recipe: no CoT, horizon 8, b8/GPU x4 = global
# 32, 30k updates, 1k warmup, FA3, fully trainable backbone, no checkpointing.
run_id: insight_q35_08_causal_oft_state30_b32_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: '0.21'

framework:
  name: QwenOFT
  state_token_mode: reserved_ids
  state_routing: token_only
  state_num_bins: 256
  state_token_source: rare_real
  # The full embedding table is trainable at the VLM LR, so do not introduce a
  # separate bin table with a different optimizer group.
  trainable_bin_embedding: false
  qwenvl:
    base_vlm: /e/project1/m3/blank4/code/train_downstream/train/outputs/insight_q35_08_causal_v5/2026-09-22_00-58-32_job1943334/checkpoints/checkpoint-28786
    attn_implementation: flash_attention_3
    vl_hidden_dim: 1024
    vlm_impl: qwen35
    enc_dec: false
  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 0
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  vla_data:
    action_horizon: 8
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 8
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: v3.0
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: true
    # Versioned opt-in: historical LIBERO state-token checkpoints used raw values
    # clipped by the quantizer. This run uses the intended training/eval-matched q99
    # normalization before token binning.
    state_normalization: q99
    augmentation: crop_photometric
    pack_image_size: [224, 224]
    seed: 42
    marigold_resume_batches_per_rank: 0
    marigold_resume_steps: 0

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

use_deepspeed: true
