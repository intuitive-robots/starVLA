# PROPOSED TRACE-LOOP ARM. Requires the QwenGR00T_TraceLoop framework path;
# do not submit until the 20-update smoke validates the implementation.
# Two GPUs/run, per-device batch32, global action batch64. Seed/run_id are launcher-overridden.
# Match the encoder QwenGR00T topology used by the completed v5/shared-z runs:
# alternating trace-cross-only and action-self-only DiT blocks.
run_id: ervla_v5_gr00t_traceloop_2pass_z_pred_trace_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: '0.21'
framework:
  name: QwenGR00T_TraceLoop
  readout_tokens:
    enabled: false
    num_tokens: 32
    num_layers: 2
    num_heads: 8
    ffn_dim: 0
    dropout: 0.0
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    skip_decoder: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    num_vl_layers: 28
    use_merged_attention: false
    separate_cross_attention: true
    cross_attention_gate_init: 0.1
    layerwise_decoder_cross_attention: false
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 0
    action_horizon: 16
    hidden_size: 768
    action_hidden_dim: 768
    add_pos_embed: true
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      dropout: 0.1
      extra_conditioning_dim: 128
      cross_attention_dim: 2048
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    future_action_window_size: 15
    past_action_window_size: 0
  trace_loop:
    enabled: true
    num_points: 5
    coordinate_dim: 2
    target_field: trajectory2d
    target_normalization: unit_interval
    slot_token: <|fim_middle|>
    slot_placement: assistant_suffix
    detach_pass2_coordinates: true
    quantization_bins: 1001
    coordinate_embedding:
      type: fourier_mlp
      num_frequencies: 16
      hidden_dim: 512
      add_waypoint_embedding: true
    num_passes: 2
    pass2_source: predicted
    action_context: trace_pass2
  shared_z:
    enabled: true
    dim: 128
    num_queries: 4
    query_dim: 512
    num_heads: 8
    memory_dropout_rate: 0.0
    distribution_weight: 0.05
    separation_weight: 0.1
    separation_margin: 0.5
    shuffle_targets: false
    decoder_memory: false
    targets:
      target_point:
        dim: 2
        weight: 0.1
      object_box:
        dim: 4
        weight: 0.1
      ground_relation:
        dim: 2
        weight: 0.2
      ground_visibility:
        dim: 2
        weight: 0.05
      trajectory3d:
        dim: 15
        weight: 0.25
      phase:
        dim: 4
        weight: 0.1
        loss: cross_entropy
    temporal:
      enabled: true
      future_offset: 8
      weight: 1.0
  choice_policy:
    enabled: false
    location: encoder
    num_choices: 5
datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: v3.0
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false
    augmentation: crop_photometric
    CoT_prompt: Your task is {instruction}. Describe the current subtask and motion. Ground the relevant object
      in cam1 and cam2, give the cam1 image target and trajectory, and give the future gripper trajectory as 3D
      deltas in the current cam2 frame.
    cot:
      source: mapping
      mapping_path: /e/project1/m3/blank4/code/encdec-vlm/train/encoder_decoder_training/enc_dec_cot/mappings/cot_d_cam3d.jsonl
      text_supervision: false
      dropout_enabled: false
      dropout_rate: 0.0
    shared_z_future_offset: 8
trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
    trace_loop: 0.0001
    shared_z_pooler: 0.0001
    shared_z_heads: 0.0001
    shared_z_future_predictor: 0.0001
    shared_z_difference_decoder: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.cross_attn_adapters,qwen_vl_interface.model.model.language_model.decoder_embed_tokens,qwen_vl_interface.model.model.language_model.decoder_norm,qwen_vl_interface.model.lm_head
  loss_scale:
    vla: 1.0
    vlm: 0.1
    trace_loop:
      start: 0.0
      end: 0.05
      start_step: 0
      end_step: 1000
    structured_aux:
      start: 0.0035
      end: 0.05
      start_step: 300
      end_step: 1000
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
