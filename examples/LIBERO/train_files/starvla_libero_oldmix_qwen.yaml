# Reproduce the data setup of the 97.4%/93% run (1229_libero4in1_qwen35oft).
#
# Differences vs starvla_cotrain_libero.yaml, all on the DATA side:
#   data_mix        libero_mixed (1 combined v3.0 dataset) -> libero_all (4 v2.1 subsets)
#   data_root_dir   lerobot_3_0/libero_lerobot             -> playground/Datasets/LEROBOT_LIBERO_DATA
#   lerobot_version v3.0                                    -> v2.1
#   video_backend   decord                                  -> torchvision_av
#   warmup          3000                                    -> 1000
#
# ⚠️ MUST be launched with STARVLA_LIBERO_GRIPPER_NORM=none
# The old datasets store gripper as {0=close, 1=open}. Applying "binary_invert"
# (the current default) to that would flip the training target, and since the
# checkpoint doesn't record the mode, eval would then invert it a second time.
# See examples/LIBERO/train_files/data_registry/data_config.py.
#
# NOTE: libero_all sums the 4 subsets, and LeRobotMixtureDataset is built with
# balance_dataset_weights=False, so each subset is sampled with probability 0.25
# regardless of size -- libero_10 (37% of frames) is undersampled to 25%, while
# spatial/goal (19% each) are oversampled ~1.3x. That is what the original run did.
run_id: libero_qwen08b_oldmix
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3.5-0.8B
    attn_implementation: sdpa   # flash_attention_3 also available on GH200
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    action_horizon: 8
    action_model_type: MLP

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 32
    load_all_data_for_training: true
    # The original run used torchvision_av, but torchvision 0.27 removed
    # io.VideoReader (video decoding moved to torchcodec, which isn't installed).
    # decord is byte-identical to pyav on these files (verified), so this only
    # changes decode speed, not pixels.
    video_backend: decord
    # "v2.0" is the loader's name for the pre-v3 layout (one mp4 + one parquet per
    # episode). The datasets self-report codebase_version "v2.1", but _get_trajectories()
    # only branches on "v2.0" / "v3.0" and returns None for anything else. This is also
    # the default, and what the original 97.4% run used (its config omits the key).
    lerobot_version: "v2.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
