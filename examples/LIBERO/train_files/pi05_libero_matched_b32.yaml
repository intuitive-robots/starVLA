# pi0.5 (PI05, init pi05_base_starvla) on our LIBERO pipeline, matched to the best Qwen arm
# rb_cdmffc16_p6_s42 (ervla_v5_gr00t_state_enc_v3_b32.yaml + E7f + future-copy flags) in everything but the
# backbone (2026-10-05). This yaml is the CONTROL (plain port); the recipe arm adds the E7f + FC flags of
# submit_e7ffc_20261002.sh with the layer mapped 16/28 -> 10/18 (see /e/scratch/m3/blank4/rb_cd/submit_pi05_pair_20261005.sh).
#
# Data: datasets.vla_data copied verbatim from the reference's config.full.yaml (libero_mixed, both cameras,
# crop_photometric augmentation in the workers, pack 224, RAW state as in the reference: no state_normalization
# key, so the state is clipped to [-1, 1] by the binning). future_offsets [8] + keep_tail are set in BOTH arms
# so the two arms read the same data stream (the control ignores the future frames).
#
# pi0.5 settings: state as 256-bin digits in the prompt ("Task: ..., State: b0 ... b7;\nAction: "), binned exactly
# like the reference's state tokens (discrete_state_mode starvla); cameras in the base_0_rgb / left_wrist_0_rgb
# slots (openpi's LIBERO convention masks the right-wrist slot out, which equals dropping it); action expert
# predicts 8 steps, flow loss over the 7 real dims with 8 repeated noise samples (GR00T repeated_diffusion_steps),
# 4 Euler steps at inference.
datasets:
  vla_data:
    action_horizon: 8
    action_type: delta_qpos
    augmentation: crop_photometric
    data_mix: libero_mixed
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    dataset_py: lerobot_datasets
    drop_last: true
    include_state: true
    lerobot_version: v3.0
    load_all_data_for_training: true
    marigold_resume_batches_per_rank: 0
    marigold_resume_steps: 0
    num_workers: 8
    pack_image_size:
    - 224
    - 224
    per_device_batch_size: 8
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 4
    seed: 42
    sequential_step_sampling: false
    video_backend: decord
    future_offsets:
    - 8
    shared_z_future_keep_tail: true
framework:
  name: PI05
  precision: bfloat16
  action_dim: 32
  action_horizon: 8
  max_state_dim: 32
  discrete_state_input: true
  discrete_state_mode: starvla
  state_token_mode: text
  state_num_bins: 256
  max_token_len: 200
  num_inference_steps: 4
  image_resolution:
  - 224
  - 224
  image_keys:
  - base_0_rgb
  - left_wrist_0_rgb
  train_forward: split
  repeated_diffusion_steps: 8
  action_loss_dims: 7
  output_action_dim: 7
  tokenizer:
    model_path: /e/scratch/m3/blank4/hf_pi_model_starvla/tokenizer/paligemma_tokenizer.model
    pad_state_value: -2.0
    extra_pythonpath: /e/scratch/m3/blank4/pylibs_openpi
  paligemma:
    model_name_or_path: ''
  action_model:
    action_horizon: 8
  # read only by train_starvla.log_eval_backend_banner (assumes a Qwen backbone); the pi0 prefix/expert use SDPA
  # in training and eager attention in the cached inference path
  qwenvl:
    attn_implementation: sdpa
  modality_dropout:
    enabled: false
  fusion_registers:
    enabled: false
  future_copies:
    enabled: false
  state_dropout_rate: 0.0
  state_dropout_mask: false
  instruction_dropout_rate: 0.0
is_debug: false
run_root_dir: playground/Checkpoints
seed: 42
trainer:
  pretrained_checkpoint: /e/scratch/m3/blank4/hf_pi_model_starvla/pi05_base_starvla/bfloat16/model.safetensors
  eval_interval: 1000
  # unused in the pi0.5 graph: the action expert's LM head (263M) and the PaliGemma final norm
  freeze_modules: action_head.gemma_expert.lm_head,vlm.model.model.language_model.norm
  full_state_save_total_limit: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  gradient_clipping: 1.0
  # reference groups mapped: qwen_vl_interface 1e-5 -> PaliGemma (vlm), action_model 1e-4 -> action expert
  # (action_head), base 2.5e-5 -> everything else (mask embeddings, predictors, future markers)
  learning_rate:
    action_head: 0.0001
    base: 2.5e-05
    vlm: 1.0e-05
  logging_frequency: 100
  loss_scale:
    vla: 1.0
    structured_aux: 0.05
  lr_scheduler_type: cosine_with_min_lr
  max_grad_norm: 1.0
  max_train_steps: 50000
  num_warmup_steps: 1000
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    name: AdamW
    weight_decay: 1.0e-08
  save_full_training_state: true
  save_interval: 5000
  save_total_limit: 1
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  weight_decay: 0.0
  is_resume: false
use_deepspeed: true
wandb_entity: niblank
wandb_project: starvla_libero
