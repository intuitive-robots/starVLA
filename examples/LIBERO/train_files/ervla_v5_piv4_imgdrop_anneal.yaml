# LIBERO piv4 + ANNEALED IMAGE DROPOUT -- the two-stage curriculum as a single run.
#
# LIT, APT, LA4VLA and the action-prior line all force one thing: a pathway that carries
# action information with no image in the input, so the dense visual channel cannot
# shortcut the sparse language/state one. All four pay a separate first stage for it,
# because in a decoder-only VLA "no images" is a different prompt -- different length,
# different positions, different cache -- needing its own checkpoint and LR schedule.
#
# In the bidirectional encoder it is a per-row property of an ordinary batch, so the
# curriculum can be a rate that DECAYS instead of a cliff between two checkpoints:
#     steps      0 -  2,000   every row blind      (instruction + quantised state only)
#     steps  2,000 - 10,000   linear 1.0 -> 0.0    (a shrinking blind fraction)
#     steps 10,000 - 20,000   fully sighted
# Those are the 5k/25k/50k fractions of the RoboCasa arm scaled to LIBERO's 20k budget.
#
# Vision is removed by zeroing pixel_values, NOT by dropping image tokens: token count,
# sequence length, attention mask, mrope positions and FLOPs stay bit-identical to a
# sighted row, so rows at different points of the schedule stay comparable inside one
# batch. The alternative mechanism (removal: tokens) is what the sequential arm uses.
# See starVLA/model/modules/modality_dropout.py.
#
# STATE: unlike the no-state control, every arm in this family sets include_state: true /
# state_dim: 8. Proprioception reaches the bidirectional encoder as TEXT --
# Qwen_PI_v3._add_state_conditioning quantises the normalised state into 256 uniform bins
# over [-1,1] and appends "<instruction> [STATE] <bins> [ACTION]" (the pi-0.5 convention,
# share_tools.state2str_transform), and the piv4 head also receives it as a state token.
# A blinded row therefore still carries instruction + state, which is exactly LA4VLA's
# vision-free stage-1 input.
#
# CONTROL: ervla_v5_piv4_state.yaml (same state, no dropout), NOT the older no-state
# ervla_v5_piv4_actiononly.yaml (seeds 42/43, job 1858694, evals 1858835/36). Adding state
# and adding dropout are two changes; measuring against the no-state run would confound
# them. The no-state run stays useful as the separate "does state help at all" reference.
run_id: ervla_v5_piv4_imgdrop_anneal
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v4
  # ── the only block that differs from ervla_v5_piv4_state.yaml ───────────
  modality_dropout:
    enabled: true
    removal: pixels
    vision_rate: {start: 1.0, end: 0.0, start_step: 2000, end_step: 10000}
    mode: all
    # Rollout and in-training eval always see: the arm is about what the encoder is
    # forced to learn, not about shipping a blind policy.
    inference_vision_rate: 0.0
    protect_state: true
  # ───────────────────────────────────────────────────────────────────────
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    skip_decoder: true
    collect_encoder_layers: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    num_vl_layers: 28
    use_merged_attention: false
    separate_cross_attention: true
    cross_attention_gate_init: 0.1
  action_model:
    action_model_type: LayerwiseFM_v4
    action_dim: 7
    state_dim: 8           # LIBERO proprioception (7 joints + gripper)
    action_horizon: 8
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.0
      final_dropout: false
      norm_type: ada_norm
      attention_head_dim: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 8
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: true
    augmentation: crop_photometric

trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 1.0e-06}
  freeze_modules: 'qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.cross_attn_adapters,qwen_vl_interface.model.model.language_model.decoder_embed_tokens,qwen_vl_interface.model.model.language_model.decoder_norm,qwen_vl_interface.model.lm_head'
  loss_scale: {vla: 1.0, vlm: 0.1}
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer: {name: AdamW, betas: [0.9, 0.95], eps: 1.0e-08, weight_decay: 1.0e-08}
