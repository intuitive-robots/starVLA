# Causal twin of the modality-preserving z-only encoder arm. All VLM and
# interface parameters are trainable; state reaches the policy only as token IDs.
run_id: p0_c15_modz24_state_tokonly_causal_b32_30k_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: '0.21'

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_3
    vl_hidden_dim: 2048
    enc_dec: false
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 768
    hidden_size: 768
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 0
    token_state_dim: 8
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 12
      output_dim: 768
      positional_embeddings: null
    future_action_window_size: 7
    past_action_window_size: 0
  choice_policy:
    enabled: false
    location: encoder
    num_choices: 5
  readout_tokens:
    enabled: false
  modality_z:
    enabled: true
    external_tokens: 8
    wrist_tokens: 8
    language_tokens: 4
    state_tokens: 4
    latent_dim: 768
    num_layers: 2
    num_heads: 8
    ffn_dim: 3072
    dropout: 0.0
  state_token_mode: reserved_ids
  state_routing: token_only
  state_num_bins: 256
  state_token_source: rare_real
  trainable_bin_embedding: false

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  vla_data:
    action_horizon: 8
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 8
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: v3.0
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: true
    augmentation: crop_photometric
    pack_image_size: [224, 224]
    seed: 42
    marigold_resume_batches_per_rank: 0
    marigold_resume_steps: 0

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
    modality_z_interface: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_full_training_state: true
  save_total_limit: 32
  full_state_save_total_limit: 2

use_deepspeed: true
