run_id: GR00T_real_robot_abs_eef_qwen08ft_cot_insulated
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_real_robot
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_CoTrain      # registered in QwenGR00T_CoTrain.py
  qwenvl:
    base_vlm: /e/home/jusers/blank4/jupiter/blank4/code/train_downstream/train/outputs/ours_t097_fsd_rp_llov2_qwen35_0_8b_128/2026-05-17_01-57-08/checkpoints/checkpoint-9056
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_dim: 8
    state_dim: 0
    action_horizon: 24
    action_model_type: DiT-B
    hidden_size: 768
    action_hidden_dim: 768
    add_pos_embed: True
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      dropout: 0.1

  # ── Knowledge insulation (π0 / arxiv 2605.02881) ─────────────────────────
  # When true: hidden states are detached before the DiT action expert.
  # The VLM backbone receives gradients only from VLM co-training and CoT CE loss.
  # Set false to reproduce standard QwenGR00T behaviour (coupled gradients).
  knowledge_insulation: true


datasets:
  # No vlm_data section needed — CoT supervision is handled inside forward()
  # via the step-based cot_resolver.  Add vlm_data here only if running with
  # train_starvla_cotrain.py for additional VLM co-training.
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/ours_real_robot_ambiguity
    data_mix: real_robot_mixed
    action_type: abs_ee
    sequential_step_sampling: False

    CoT_prompt: "Your task is {instruction}. What is the next subtask? Point to the target location."

    # Step-based CoT supervision.
    # Build with: python scripts/create_cot_mapping.py --annotations ... --output ...
    cot:
      source: mapping
      mapping_path: data/cot_mappings/real_robot_ours_ours_cot.jsonl

    per_device_batch_size: 32
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false


trainer:
  max_train_steps: 20000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    cot: 0.1    # CoT CE loss weight (per-step bounding-box annotations)
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
