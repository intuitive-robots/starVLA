# BARE-PROMPT arm. The mask FT (phase0h:398) trains with the RAW instruction:
#     [{'role':'user','content':[image, text=instruction]}]
# but every policy config so far injected a CoT_prompt, so the enc-dec encoder --
# which is BIDIRECTIONAL, i.e. image tokens attend to the text -- was evaluated with a
# text distribution it never saw during mask FT:
#   GR00T: 'Your task is {i}. Generate the 2D trajectory ... Output exactly 5 points.'
#   OFT:   'Your task is {i}. To identify the key objects ... bounding boxes [x1,y1,x2,y2]'
# Note the OFT prompt is semantically ALIGNED with the mask objective (locate objects)
# and the GR00T one is not, which is a competing explanation for mask FT being worth
# +15.5pp under OFT and +2.1pp under GR00T. This arm removes the prompt entirely so
# policy-time text == mask-FT-time text.
# The `cot:` block is removed too: it was INERT (QwenGR00T passes cot_conversations= to
# build_qwenvl_inputs, whose signature is (images, instructions, solutions=None,
# **kwargs) -- it lands in kwargs and is silently dropped, which is why no cot_loss key
# ever appears in the logs). Keeping it without CoT_prompt would trip
# assert_cot_prompt_consistent() at startup.
# DECOMPOSITION of the +11.5pp GR00T result. Every GR00T comparison so far was
# `enc-dec + mask FT` vs `CAUSAL base`, i.e. two variables at once, so H1 (mask
# supervision) and H2 (encoder-decoder) were never separated under this read-out.
# Motivation: mask CONTENT appears not to matter downstream -- the object-10 tail
# (libero_object has 0/10 same-category distractors, so no referring decision exists)
# scores 89.8%, matching the spatial tail's 91.0%; the no-swap control was null; and the
# wrist camera, which lacks a referring decision in 92% of frames, was null.
# THIS ARM: enc-dec, NO mask FT at all. Isolates H2 alone. If this already scores ~90%,
# the entire effect is the architecture and mask supervision contributes nothing.
# ARM: QwenGR00T + readout projector (enc-dec + spatial mask-FT).
# Motivation: QwenOFT reads `chunk_len` action PLACEHOLDER tokens appended to the
# input sequence. Under causal attention each placeholder sees a different prefix so
# they differentiate; in a BIDIRECTIONAL encoder they all see the same context and
# differ only by positional encoding, so the enc-dec arms may have been handing the
# action expert near-duplicate queries. GR00T's ReadoutProjector is a Q-Former whose
# learned queries CROSS-ATTEND the full token sequence, making no causality
# assumption -- the mechanism that should actually exploit a bidirectional encoder.
# LIBERO (libero_mixed) + GR00T DiT action head + trace-style CoT supervision.
#
# Counterpart of examples/LIBERO-plus/train_files/starvla_cotrain_libero_plus_cot_qwen.yaml,
# but with the TRACE prompt/mapping instead of the bounding-box one.
#
# Differences vs starvla_cotrain_libero.yaml (the plain-OFT base):
#   - framework QwenOFT -> QwenGR00T_CoT (builds a cot_resolver; QwenOFT does not)
#   - action head MLP -> DiT-B (flow matching)
#   - adds datasets.vla_data.cot + trainer.loss_scale.cot
#   - state dropped (state_dim 0 / include_state false), as in the CoT real-robot configs
#
# CoT source: data/cot_mappings/libero_mixed_ours_trace.jsonl  (selection_mode=ours)
run_id: libero_gr00t_arm_plain_bare
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  readout_tokens:
    enabled:    true
    num_tokens: 32
    num_layers: 2
    num_heads:  8
    ffn_dim:    0
    dropout:    0.0

  qwenvl:
    base_vlm:  /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_t097_fsd_rp_llov2/2026-06-12_01-49-02/checkpoints/checkpoint-9056
    skip_decoder: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7          # LIBERO delta eef (6) + gripper (1)
    state_dim: 0
    action_horizon: 16
    action_model_type: DiT-B
    hidden_size: 768
    action_hidden_dim: 768
    add_pos_embed: True
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      dropout: 0.1

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: False



    per_device_batch_size: 32
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: 'qwen_vl_interface'
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
