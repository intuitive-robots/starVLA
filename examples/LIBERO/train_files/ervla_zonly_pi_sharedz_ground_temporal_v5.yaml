run_id: ervla_zonly_pi_sharedz_ground_temporal_v5_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    # v5 backbone (Sept) instead of the June t097_fsd_rp_llov2 that the original
    # zonly run and 68 other LIBERO configs use. Everything else -- shared_z
    # bottleneck, PI topology, data, schedule, augmentation -- is unchanged, so
    # this pairs the strongest objective with the newer encoder.
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    skip_decoder: true
    collect_encoder_layers: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    use_merged_attention: false
    separate_cross_attention: true
    layerwise_decoder_cross_attention: false
    cross_attention_gate_init: 0.1
  shared_z:
    enabled: true
    dim: 128
    num_queries: 4
    query_dim: 512
    num_heads: 8
    memory_dropout_rate: 1
    distribution_weight: 0.05
    separation_weight: 0.10
    separation_margin: 0.50
    shuffle_targets: false
    decoder_memory: false
    targets:
      target_point: {dim: 2, weight: 0.10}
      object_box: {dim: 4, weight: 0.10}
      ground_relation: {dim: 2, weight: 0.20}
      ground_visibility: {dim: 2, weight: 0.05}
      trajectory3d: {dim: 15, weight: 0.25}
      phase: {dim: 4, weight: 0.10, loss: cross_entropy}
    temporal:
      enabled: true
      future_offset: 8
      weight: 1.0
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 0
    action_horizon: 16
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    layerwise_attention_layout: alternating
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      attention_head_dim: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 16
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false
    augmentation: crop_photometric
    shared_z_future_offset: 8
    CoT_prompt: "Your task is {instruction}. Describe the current subtask and motion. Ground the relevant object in cam1 and cam2, give the cam1 image target and trajectory, and give the future gripper trajectory as 3D deltas in the current cam2 frame."
    cot:
      source: mapping
      mapping_path: /e/project1/m3/blank4/code/encdec-vlm/train/encoder_decoder_training/enc_dec_cot/mappings/cot_d_cam3d.jsonl
      text_supervision: false
      dropout_enabled: false
      dropout_rate: 0.5

trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    shared_z_pooler: 1.0e-04
    shared_z_heads: 1.0e-04
    shared_z_future_predictor: 1.0e-04
    shared_z_difference_decoder: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 1.0e-06}
  freeze_modules: 'qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.decoder_embed_tokens,qwen_vl_interface.model.model.language_model.decoder_norm,qwen_vl_interface.model.lm_head'
  loss_scale:
    vla: 1.0
    vlm: 0.1
    structured_aux:
      start: 0.0035
      end: 0.05
      start_step: 300
      end_step: 1000
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer: {name: AdamW, betas: [0.9, 0.95], eps: 1.0e-08, weight_decay: 1.0e-08}
