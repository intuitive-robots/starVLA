# LIT stage 2: vision restored, geometry becomes the TARGET (25k, bsz32)
#
# LIT-style two-stage privileged-geometry curriculum (arXiv:2609.12641,
# "Breaking the Vision-Action Shortcut"), adapted to the signals this repo already has.
#
# WHY, given our own negative result: the earlier image-free curriculum collapsed. blind
# 35.7 / anneal-2k 39.0 / anneal-10k 36.3 against a 77.7 control, and Robot Initial States
# at 5-7% against the control's 61% -- indistinguishable from a permanently blind model.
# Predicting an action chunk from language+state alone is underdetermined, so the model
# learns the degenerate marginal and never recovers the vision path. LIT's stage 1 is NOT
# underdetermined because the terminal pose largely determines the chunk.
#
# trajectory3d (15 dims, future gripper path in cm) is our analogue of LIT's terminal
# pose, generalised to the whole path. It is integer centimetres / 20, so 256 uniform bins
# over [-1,1] reproduce it EXACTLY (measured: 0.060 cm error, 100% exact over 40k
# annotations). object_box and target_point are image coords / 1000 in [0,1].
#
# Stage 1 feeds these as reserved-vocabulary tokens with images masked.
# Stage 2 drops them, restores vision, and shared_z REGRESSES the same quantities --
# LIT's pose decoder. At inference both are gone (see QwenGR00T inference site).
#
# STAGE 2: privileged tokens OFF, vision ON, backbone unfrozen, shared_z targets ON
# (target_point / object_box / trajectory3d / phase). Init from stage 1.
# trainer.pretrained_checkpoint is filled in by the launcher.
#
# MEMORY PATH (corrected 2026-09-19): the base recipe this was derived from is the `zonly`
# arm -- readout_tokens(32) + shared_z(4 queries -> 128d) + memory_dropout_rate 1.0, i.e.
# the action head sees ONLY a 128-dim vector. That is wrong for this experiment. The
# privileged trace enters as INPUT TOKENS TO THE ENCODER, so under z-only it would have to
# survive compression to 128 dims before reaching the action head -- while LIT feeds its
# goal tokens straight into the action expert's per-layer conditioning. Squeezing the
# privileged signal through our narrowest channel would confound "does the curriculum work"
# with "does it survive a 128-dim bottleneck".
#
# So: memory_dropout_rate 0.0 and readout_tokens disabled. The action head cross-attends to
# the full encoder memory, where the trace tokens' hidden states actually live. shared_z is
# kept ONLY as the stage-2 target readout (LIT's pose decoder D_omega), not as the channel.
#
# INJECTION MECHANISM: shared_z.adaln_conditioning is FALSE here, so z does NOT modulate
# the DiT's AdaLN. It is computed and supervised, but purely as the stage-2 auxiliary
# readout (LIT's pose decoder D_omega, which reads the latents and predicts the goal --
# it does not condition the expert; the latents do that natively).
#
# Rationale, from the injection survey: routing VLM CONTENT through AdaLN has ZERO
# comparators in the literature. GR00T N1, FLOWER and ThinkProprio all have AdaLN in the
# action head and all deliberately restrict it to low-dimensional global signals -- flow
# timestep, embodiment embedding -- while routing semantic content through cross-attention.
# ThinkProprio states the split explicitly ("inject T via global AdaLN-style modulation
# while cross-attending to C"), i.e. the opposite assignment to our shared-z default.
# RDT-1B pushes even scalars into the token sequence rather than use AdaLN.
#
# With adaln_conditioning false the only VLM->action channel is token-level cross-attention
# over the encoder memory (encoder_hidden_states=vl_embs), with AdaLN carrying the flow
# timestep alone -- the literature-standard design, already implemented in our head.
# Testing an unprecedented injection mechanism inside a curriculum experiment would confound
# two unknowns at once; the AdaLN-vs-cross-attn-vs-in-context ablation is its own run.
#
#
# STAGE-2 FREEZE (corrected twice): an earlier version removed freeze_modules entirely to
# match LIT's "stage 2 jointly optimizes the backbone", and OOM'd at 83.9/95 GiB on a GH200
# at per-device batch 8.
#
# The reason is NOT activation memory. skip_decoder is true, so every module in
# freeze_modules -- language_model.layers (the decoder stack), decoder_embed_tokens,
# decoder_norm and lm_head -- is decoder-side and never executes. Freezing them saves no
# forward or backward compute at all. What it saves is OPTIMIZER STATE: unfreezing them
# allocates fp32 master weights and two Adam moments for parameters that never receive a
# gradient. lm_head alone is 151936 x 2048 ~ 311M params, about 3.7 GiB of pure waste under
# ZeRO-2, and the decoder stack adds more.
#
# What actually trains in this recipe, unchanged from the base: the ENCODER layers, the ViT
# and the action head. So "unfreezing the backbone" in LIT's sense is already what we do --
# LIT's frozen-backbone stage is stage 1, which here freezes the whole qwen_vl_interface.
