# v5 backbone (enc_dec_2b_v5_tb9216, checkpoint-30054) + GR00T action head.
#
# Head-comparison arm B. Pairs with ervla_v5_pi_actiononly_pifix.yaml: the
# backbone block, data, and trainer block are identical between the two files
# (the single exception is collect_encoder_layers, which PI needs and GR00T does
# not), so the action head is the only variable.
#
# The head's own internals stay at the settings this head was tuned with in
# encdec_libero_gr00t_plain_ft.yaml -- 32 readout queries, DiT hidden 768,
# 12 layers, dropout 0.1 -- rather than being forced to match PI's. Matching
# head internals across two different heads would test a crippled variant of one
# of them, not the heads.
#
# Deliberately changed from encdec_libero_gr00t_plain_ft.yaml so the arms line up:
#   max_train_steps  30000 -> 20000     (PI lineage / the controls)
#   num_warmup_steps  1000 -> 2000
#   freeze_modules      '' -> frozen    (that arm was the unfrozen one)
#   augmentation      none -> crop_photometric
# Seeds are launched by overriding run_id and seed; this recipe stays fixed.
run_id: ervla_v5_gr00t_actiononly_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  readout_tokens:
    enabled: true
    num_tokens: 32
    num_layers: 2
    num_heads: 8
    ffn_dim: 0
    dropout: 0.0
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    skip_decoder: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    num_vl_layers: 28
    use_merged_attention: false
    separate_cross_attention: true
    cross_attention_gate_init: 0.1
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 0
    action_horizon: 16
    hidden_size: 768
    action_hidden_dim: 768
    add_pos_embed: true
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      dropout: 0.1

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    # 32/device x 2 GPUs = 64 effective -- identical to the controls, which ran
    # two models per 4-GPU node (slot 0 on GPUs 0,1 and slot 1 on GPUs 2,3).
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false
    augmentation: crop_photometric

trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 1.0e-06}
  # Frozen-backbone representation comparison, as in every control run so far.
  freeze_modules: 'qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.cross_attn_adapters,qwen_vl_interface.model.model.language_model.decoder_embed_tokens,qwen_vl_interface.model.model.language_model.decoder_norm,qwen_vl_interface.model.lm_head'
  loss_scale: {vla: 1.0, vlm: 0.1}
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer: {name: AdamW, betas: [0.9, 0.95], eps: 1.0e-08, weight_decay: 1.0e-08}
