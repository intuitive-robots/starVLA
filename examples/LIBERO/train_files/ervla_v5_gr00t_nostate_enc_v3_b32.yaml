# GR00T + bidirectional converted encoder + NO state (stateless control) (bsz32, 30k)
#
# Generated arm for the state-conditioned encoder-vs-causal grid (bsz 32, 30k steps).
#
# STATE: proprioception is normalised by the dataloader's q99 transform into [-1, 1],
# quantised into 256 uniform bins, and mapped to DEDICATED vocabulary token ids
# (framework.state_token_mode: reserved_ids) rather than rendered as decimal text.
# Bin b -> id vocab_size-1-b = 151935-b, the scheme in ThinkProprio (arXiv:2602.06575).
# Qwen3-VL-2B declares vocab_size 151936 while the highest real/special token id is
# 151668, so ids 151680..151935 are dead embedding rows: no resize, no collision, one
# dedicated embedding per bin, and exactly state_dim tokens per sample instead of the
# variable 1-3 BPE tokens the text encoding produced.
#
# ThinkProprio Tab. 7 is the reason this matters: state injected late at the action head
# performs identically to omitting state entirely; the gain appears only when token-form
# state is routed through the backbone as an active query.
#
# RETRAIN 2026-09-20 with the FIXED state encoding.
# The first generation of these arms used the dead reserved rows (state_token_source unset
# -> "reserved"), where 256 bins collapse onto 7 near-identical embedding vectors. Measured
# cost on plain LIBERO against a 95.0% healthy reference: causal 73.0% (-22pp), encoder
# 30.1% (-65pp). The encoder suffers ~3x the damage because bidirectional attention
# propagates the degenerate tokens to every position.
#
# This generation pins state_token_source: rare_real (real Latin-free token rows, 256/256
# distinct, norm 1.48, pairwise distance 2.05) and gets trainable bin embeddings by default
# (~0.5M params, backbone still frozen per freeze_modules).
#
# Batch: per_device 8 x 4 GPUs on ONE node = global 32, matching the first generation's
# global batch while using a whole node per arm (~2x the steps/h of a pair job).
#
# trainable_bin_embedding: FALSE here, deliberately.
#
# These arms do NOT freeze the backbone -- freeze_modules covers only decoder-side modules,
# and skip_decoder means those never execute, so embed_tokens is already trainable. The bin
# rows therefore learn either way. Routing them through the separate state_bin_embed module
# would instead cause two unintended differences from the v1 arms we are comparing against:
#
#   1. LEARNING RATE. state_bin_embed is a framework attribute, not part of
#      qwen_vl_interface, so build_param_lr_groups sweeps it into the `base` group at
#      2.5e-05 -- 2.5x the 1e-05 that embed_tokens gets. The bins would train faster than
#      the table they were copied from, for no reason.
#   2. STALE ROWS. The forward hook REPLACES the table's output at bin positions, so those
#      embed_tokens rows receive no gradient and stay at initialisation forever. A
#      checkpoint trained that way carries dead rows at those ids; loading it with
#      trainable_bin_embedding false would silently fall back to them and produce garbage
#      while loading cleanly -- exactly the silent-corruption pattern that cost us a day.
#
# The separate module remains necessary for LIT stage 1, which freezes qwen_vl_interface
# entirely and therefore cannot train the bins any other way.
