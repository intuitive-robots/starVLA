# GR00T + bidirectional converted encoder + token-id state (bsz32, 40k)
#
# Generated arm for the state-conditioned encoder-vs-causal grid (bsz 32, 40k steps).
#
# STATE: proprioception is normalised by the dataloader's q99 transform into [-1, 1],
# quantised into 256 uniform bins, and mapped to DEDICATED vocabulary token ids
# (framework.state_token_mode: reserved_ids) rather than rendered as decimal text.
# Bin b -> id vocab_size-1-b = 151935-b, the scheme in ThinkProprio (arXiv:2602.06575).
# Qwen3-VL-2B declares vocab_size 151936 while the highest real/special token id is
# 151668, so ids 151680..151935 are dead embedding rows: no resize, no collision, one
# dedicated embedding per bin, and exactly state_dim tokens per sample instead of the
# variable 1-3 BPE tokens the text encoding produced.
#
# ThinkProprio Tab. 7 is the reason this matters: state injected late at the action head
# performs identically to omitting state entirely; the gain appears only when token-form
# state is routed through the backbone as an active query.
datasets:
  vla_data:
    CoT_prompt: Your task is {instruction}. Describe the current subtask and motion. Ground the relevant
      object in cam1 and cam2, give the cam1 image target and trajectory, and give the future gripper
      trajectory as 3D deltas in the current cam2 frame.
    action_horizon: 8
    action_type: delta_qpos
    augmentation: crop_photometric
    cot:
      dropout_enabled: false
      dropout_rate: 0.5
      mapping_path: /e/project1/m3/blank4/code/encdec-vlm/train/encoder_decoder_training/enc_dec_cot/mappings/cot_d_cam3d.jsonl
      source: mapping
      text_supervision: false
    data_mix: libero_mixed
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    dataset_py: lerobot_datasets
    drop_last: true
    include_state: true
    lerobot_version: v3.0
    load_all_data_for_training: true
    marigold_resume_batches_per_rank: 0
    marigold_resume_steps: 0
    num_workers: 8
    pack_image_size:
    - 224
    - 224
    per_device_batch_size: 16
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 4
    seed: 42
    sequential_step_sampling: false
    video_backend: decord
  vlm_data:
    base_interval: 2
    data_flatten: false
    dataformat: llava_json
    dataset_py: vlm_datasets
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    num_workers: 4
    per_device_batch_size: 4
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 2
framework:
  action_model:
    action_dim: 7
    action_hidden_dim: 768
    action_horizon: 8
    action_model_type: DiT-B
    add_pos_embed: true
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 12
      output_dim: 768
      positional_embeddings: null
    future_action_window_size: 7
    hidden_size: 768
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    num_timestep_buckets: 1000
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    state_dim: 8
  choice_policy:
    enabled: false
    location: encoder
    num_choices: 5
  name: QwenGR00T
  qwenvl:
    attn_implementation: sdpa
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    cross_attention_gate_init: 0.1
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    layerwise_decoder_cross_attention: false
    separate_cross_attention: true
    skip_decoder: true
    use_merged_attention: false
    vl_hidden_dim: 2048
  readout_tokens:
    dropout: 0.0
    enabled: false
    ffn_dim: 0
    num_heads: 8
    num_layers: 2
    num_tokens: 32
  state_token_mode: reserved_ids
  state_num_bins: 256
is_debug: false
run_id: ervla_v5_gr00t_state_enc_b32
run_root_dir: playground/Checkpoints
seed: 42
trainer:
  eval_interval: 1000
  freeze_modules: qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.decoder_embed_tokens,qwen_vl_interface.model.model.language_model.decoder_norm,qwen_vl_interface.model.lm_head
  full_state_save_total_limit: 2
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  gradient_clipping: 1.0
  learning_rate:
    action_model: 0.0001
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
  logging_frequency: 100
  loss_scale:
    vla: 1.0
    vlm: 0.1
  lr_scheduler_type: cosine_with_min_lr
  max_grad_norm: 1.0
  max_train_steps: 40000
  num_warmup_steps: 4000
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    name: AdamW
    weight_decay: 1.0e-08
  save_full_training_state: true
  save_interval: 10000
  save_total_limit: 32
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  weight_decay: 0.0
use_deepspeed: true
