# Matched causal no-z denominator: identical causal Qwen3-VL, full hidden sequence,
# GR00T topology, optimizer, data and batch as the causal shared-z arm. The only model/loss
# removal is shared z and its temporal/supervised heads. Two GPUs/run, global batch64.
run_id: ervla_causal_gr00t_fullmem_noz_b64_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: '0.21'
framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    enc_dec: false
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 768
    hidden_size: 768
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 0
    action_horizon: 16
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 12
      output_dim: 768
      positional_embeddings: null
    future_action_window_size: 15
    past_action_window_size: 0
  choice_policy:
    enabled: false
    location: encoder
    num_choices: 5
  readout_tokens:
    enabled: false
    num_tokens: 32
    num_layers: 2
    num_heads: 8
    ffn_dim: 0
    dropout: 0.0
datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: v3.0
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false
    augmentation: crop_photometric
    CoT_prompt: Your task is {instruction}. Describe the current subtask and motion.
      Ground the relevant object in cam1 and cam2, give the cam1 image target and
      trajectory, and give the future gripper trajectory as 3D deltas in the current
      cam2 frame.
    cot:
      source: mapping
      mapping_path: /e/project1/m3/blank4/code/encdec-vlm/train/encoder_decoder_training/enc_dec_cot/mappings/cot_d_cam3d.jsonl
      text_supervision: false
      dropout_enabled: false
      dropout_rate: 0.5
    pack_image_size:
    - 224
    - 224
    seed: 42
    marigold_resume_batches_per_rank: 0
    marigold_resume_steps: 0
trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.lm_head
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
use_deepspeed: true
