# Qwen3.5-0.8B full-duplicate encoder policy with proprioceptive state tokens.
# State uses 256 tokenizer-derived Latin-free real-token rows: Qwen3.5 has only 243
# unused rows above its tokenizer vocabulary, so the legacy top-of-vocabulary mapping
# is invalid. Policy recipe: no CoT, horizon 8, b8/device x 4 = global 32,
# 30k updates, 1k warmup, FA3, and no gradient checkpointing.
run_id: insight_q35_08_state_enc_gr00t30_b32_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: '0.21'
framework:
  name: QwenGR00T
  state_token_mode: reserved_ids
  state_routing: token_only
  state_num_bins: 256
  state_token_source: rare_real
  trainable_bin_embedding: false
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3.5-0.8B
    attn_implementation: flash_attention_3
    vl_hidden_dim: 1024
    vlm_impl: qwen35
    enc_dec: true
    encdec_impl: qwen35
    encdec_ckpt: __REQUIRED_C12_Q35_08_ENCODER_CHECKPOINT__
    separate_decoder_head: true
    skip_decoder: true
    num_vl_layers: 24
    use_merged_attention: false
    separate_cross_attention: false
    cross_attention_gate_init: 0.1
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 768
    hidden_size: 768
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    # State reaches the policy only through the eight pinned VLM token IDs.
    state_dim: 0
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 1024
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 12
      output_dim: 768
      positional_embeddings: null
    future_action_window_size: 7
    past_action_window_size: 0
  choice_policy:
    enabled: false
    location: encoder
    num_choices: 5
  readout_tokens:
    enabled: false
    num_tokens: 32
    num_layers: 2
    num_heads: 8
    ffn_dim: 0
    dropout: 0.0
datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  vla_data:
    action_horizon: 8
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 8
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: v3.0
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: true
    state_normalization: q99
    augmentation: crop_photometric
    pack_image_size: [224, 224]
    seed: 42
    marigold_resume_batches_per_rank: 0
    marigold_resume_steps: 0
trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.norm,qwen_vl_interface.model.lm_head
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_full_training_state: true
  save_total_limit: 32
  full_state_save_total_limit: 2
