# Single-stack Qwen3-VL-2B PrefixLM-v5 + GR00T, pinned token-only state.
#
# This is the parameter-matched answer to "why build a separate encoder?"  The
# checkpoint is continued-pretrained on exactly pretrain_v5_encoder with one
# stock Qwen stack and a PaLiGemma-style mask: bidirectional observation/prompt
# prefix, causal answer suffix, and no answer-to-prefix leakage.  Policy training
# has no answer suffix, so cameras, language, and all eight state tokens form one
# fully bidirectional prefix.  No encoder copy or unused decoder exists.
datasets:
  vla_data:
    action_horizon: 8
    action_type: delta_qpos
    augmentation: crop_photometric
    data_mix: libero_mixed
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    dataset_py: lerobot_datasets
    drop_last: true
    include_state: true
    lerobot_version: v3.0
    load_all_data_for_training: true
    marigold_resume_batches_per_rank: 0
    marigold_resume_steps: 0
    num_workers: 8
    pack_image_size: [224, 224]
    per_device_batch_size: 8
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 4
    seed: 42
    sequential_step_sampling: false
    video_backend: decord
  vlm_data:
    base_interval: 2
    data_flatten: false
    dataformat: llava_json
    dataset_py: vlm_datasets
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    num_workers: 4
    per_device_batch_size: 4
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 2
framework:
  name: QwenGR00T
  qwenvl:
    # Override with the completed PrefixLM-v5 checkpoint for production/policy smoke.
    base_vlm: __REQUIRED_QWEN3VL2B_PREFIXLM_V5_CHECKPOINT__
    vlm_impl: qwen3
    enc_dec: false
    attention_topology: full_prefix_bidir
    attn_implementation: flash_attention_3
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 768
    hidden_size: 768
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    # State is deliberately token-only; no continuous late-state bypass.
    state_dim: 0
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 12
      output_dim: 768
      positional_embeddings: null
    future_action_window_size: 7
    past_action_window_size: 0
  choice_policy:
    enabled: false
    location: encoder
    num_choices: 5
  readout_tokens:
    enabled: false
    num_tokens: 32
    num_layers: 2
    num_heads: 8
    ffn_dim: 0
    dropout: 0.0
  state_token_mode: reserved_ids
  state_routing: token_only
  state_num_bins: 256
  state_token_source: rare_real
  trainable_bin_embedding: false
run_id: insight_q3vl2_prefixlm_v5_gr00t_state_b32_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: '0.21'
trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # One stock Qwen stack: every VLM parameter, tied language embedding/head,
  # vision tower/merger, and action head remains trainable.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
use_deepspeed: true
