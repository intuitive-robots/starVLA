# StarVLA LIBERO training config — Qwen2.5-VL-2B (custom fine-tuned model)
# vl_hidden_dim: 1536 matches Qwen2.5-VL-2B hidden size
# cross_attention_dim in diffusion_model_cfg must equal vl_hidden_dim

run_id: starvla_libero_qwen2b
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity       # TODO: set your W&B entity
wandb_project: starVLA_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T                       # options: QwenGR00T | QwenPI | QwenOFT | QwenFAST
  qwenvl:
    base_vlm: playground/Pretrained_models/your_qwen2b_custom_ckpt  # TODO: path to your custom 2B checkpoint
    attn_implementation: flash_attention_2
    vl_hidden_dim: 1536                 # must match the VLM hidden size (Qwen2.5-VL-2B → 1536)
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 1536         # must equal vl_hidden_dim
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA  # TODO: path to LIBERO lerobot datasets
    data_mix: libero_all               # options: libero_all | libero_spatial | libero_object | libero_goal | libero_10
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    include_state: true

trainer:
  max_train_steps: 80000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''                    # set to 'qwen_vl_interface' to freeze VLM backbone
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
