# ERVLA diagnostic ARM F: = D with the complete causal decoder stack frozen.
#
# This tests representation shaping through a fixed pretrained decoder. Decoder operations
# remain in the autograd graph, so CoT CE still reaches the bidirectional encoder; only the
# decoder weights are excluded from AdamW and remain unchanged for all 20k steps.
run_id: ervla_f_decoder_frozen
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_t097_fsd_rp_llov2/2026-06-12_01-49-02/checkpoints/checkpoint-9056
    skip_decoder: false
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    state_dim: 0
    action_horizon: 16
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    diffusion_model_cfg:
      num_layers: 16
      output_dim: 1024
      dropout: 0.2

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: False
    per_device_batch_size: 16
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false
    augmentation: crop_photometric
    CoT_prompt: "Your task is {instruction}. Describe the current subtask, the gripper motion, and the future gripper trajectory."
    cot:
      source: mapping
      mapping_path: /e/project1/m3/blank4/code/encdec-vlm/train/encoder_decoder_training/enc_dec_cot/mappings/cot_d.jsonl
      dropout_enabled: true
      dropout_rate: 0.5

trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # lm.layers is the causal decoder. lm.encoder_layers remains fully trainable.
  freeze_modules: 'qwen_vl_interface.model.model.language_model.layers'
  loss_scale:
    vla: 1.0
    vlm: 0.1
    cot: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
