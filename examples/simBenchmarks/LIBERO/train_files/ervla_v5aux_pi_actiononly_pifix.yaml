# v5-aux-dense backbone (enc_dec_2b_v5_aux_dense, checkpoint-2000) + PI head.
#
# Byte-identical to ervla_v5_pi_actiononly_pifix.yaml except for encdec_ckpt, so
# this isolates the BACKBONE: v5_aux_dense@2000 vs v5_tb9216@30054, and against
# the six bidir/causal controls, vs the original t097 backbone.
#
# The aux_dense checkpoint carries 4 extra tensors (aux_losses.encoder_point_bce.*,
# the pretraining point-BCE head). The enc-dec loader uses load_state_dict(strict=False)
# so they land in `unexpected` and are dropped; every one of the 934 tensors the
# policy needs is present with matching shape.
#
# NOTE: this is checkpoint-2000, against 30054 for tb9216 -- a far shorter backbone
# run, so a lower score here is not by itself evidence against the aux-dense objective.
#
# Recipe is the bidir control (ervla_pi_bidir_actiononly_pifix_nolatent_nodrop)
# with only encdec_ckpt swapped, so this is also a clean old-vs-new backbone
# comparison against those six runs at 72.03-72.50 on LIBERO-plus.
#   pifix    = corrected alternating PI attention (layerwise_attention_layout)
#   nolatent = num_target_vision_tokens 0, no PI latent readout tokens
#   nodrop   = diffusion_model_cfg dropout 0.0 / final_dropout false
# Seeds are launched by overriding run_id and seed; this recipe stays fixed.
run_id: ervla_v5aux_pi_actiononly_pifix_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_aux_dense/2026-09-13_00-05-26_job1772529/checkpoints/checkpoint-2000
    skip_decoder: true
    # PI reads encoder states 0,2,...,26; GR00T reads them through readout queries
    # instead, so this flag is head-intrinsic and is the one backbone-block entry
    # that legitimately differs between the two arms.
    collect_encoder_layers: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    num_vl_layers: 28
    use_merged_attention: false
    separate_cross_attention: true
    cross_attention_gate_init: 0.1
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 0
    action_horizon: 16
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    layerwise_attention_layout: alternating
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: true
      norm_type: ada_norm
      attention_head_dim: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0/libero_lerobot
    data_mix: libero_mixed
    action_type: delta_qpos
    sequential_step_sampling: false
    # 32/device x 2 GPUs = 64 effective -- identical to the controls, which ran
    # two models per 4-GPU node (slot 0 on GPUs 0,1 and slot 1 on GPUs 2,3).
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    video_backend: decord
    lerobot_version: "v3.0"
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: false
    augmentation: crop_photometric

trainer:
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 1.0e-06}
  # Frozen-backbone representation comparison, as in every control run so far.
  freeze_modules: 'qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.cross_attn_adapters,qwen_vl_interface.model.model.language_model.decoder_embed_tokens,qwen_vl_interface.model.model.language_model.decoder_norm,qwen_vl_interface.model.lm_head'
  loss_scale: {vla: 1.0, vlm: 0.1}
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer: {name: AdamW, betas: [0.9, 0.95], eps: 1.0e-08, weight_decay: 1.0e-08}
