# Same recipe as the z-only arm, but keep encoder/readout memory on 85% of
# action examples. This isolates whether z should replace or supplement memory.
run_id: ervla_rc365_gr00t_sharedz_v5_mem015_s42
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: niblank
wandb_project: starvla_robocasa365
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  readout_tokens:
    enabled: true
    num_tokens: 32
    num_layers: 2
    num_heads: 8
    ffn_dim: 0
    dropout: 0.0
  qwenvl:
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    enc_dec: true
    encdec_ckpt: /e/project1/m3/blank4/code/train_downstream/train/outputs/enc_dec_2b_v5_tb9216/2026-09-13_04-43-47_job1770825/checkpoints/checkpoint-30054
    skip_decoder: true
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    num_vl_layers: 28
    use_merged_attention: false
    separate_cross_attention: true
    layerwise_decoder_cross_attention: false
    cross_attention_gate_init: 0.1
  shared_z:
    enabled: true
    dim: 128
    num_queries: 4
    query_dim: 512
    num_heads: 8
    memory_dropout_rate: 0.15
    distribution_weight: 0.05
    separation_weight: 0.10
    separation_margin: 0.50
    shuffle_targets: false
    decoder_memory: false
    targets:
      target_point: {dim: 2, weight: 0.10}
      object_box: {dim: 4, weight: 0.10}
      ground_relation: {dim: 2, weight: 0.20}
      ground_visibility: {dim: 2, weight: 0.05}
      trajectory3d: {dim: 15, weight: 0.25}
      phase: {dim: 4, weight: 0.10, loss: cross_entropy}
    temporal:
      enabled: true
      future_offset: 8
      weight: 1.0
  action_model:
    action_model_type: DiT-B
    action_dim: 12
    state_dim: 32
    action_horizon: 16
    hidden_size: 768
    action_hidden_dim: 768
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    diffusion_model_cfg:
      num_layers: 12
      output_dim: 768
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3.5
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  vla_data:
    action_horizon: 16
    dataset_py: lerobot_datasets
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0
    data_mix: robocasa365_v3_target_atomic_2cam
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 32
    drop_last: true
    load_all_data_for_training: true
    video_backend: torchcodec
    video_reader_cache_size: 40
    lerobot_version: "v3.0"
    num_workers: 24
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    include_state: true
    augmentation: crop_photometric
    robocasa_joint_augmentation: true
    pack_image_size: [256, 256]
    shared_z_future_offset: 8
    native_supervision:
      labels_root: /e/scratch/m3/blank4/rc365_supervision/labels_v1
      episode_cache_size: 8
      include_unreviewed_boundaries: true
      trace_subject: object
      trace_span: remaining

trainer:
  max_train_steps: 50000
  num_warmup_steps: 2000
  save_interval: 10000
  save_total_limit: 4
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    shared_z_pooler: 1.0e-04
    shared_z_heads: 1.0e-04
    shared_z_future_predictor: 1.0e-04
    shared_z_difference_decoder: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 1.0e-06}
  freeze_modules: 'qwen_vl_interface.model.model.language_model.layers,qwen_vl_interface.model.model.language_model.cross_attn_adapters,qwen_vl_interface.model.model.language_model.decoder_embed_tokens,qwen_vl_interface.model.model.language_model.decoder_norm,qwen_vl_interface.model.lm_head'
  loss_scale:
    vla: 1.0
    vlm: 0.1
    structured_aux: {start: 0.0035, end: 0.05, start_step: 300, end_step: 1000}
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer: {name: AdamW, betas: [0.9, 0.95], eps: 1.0e-08, weight_decay: 1.0e-08}
