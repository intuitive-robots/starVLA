# RoboCasa365 — Atomic-Seen (18 tasks) on the LeRobot v3.0 mirror.
#
# Data: ember-lab-berkeley/robocasa365-target-atomic (6.5 GB, 9126 episodes,
#       2.23M frames, 20 fps, PandaOmron). Same demonstrations as the official
#       Box tarballs, re-chunked to LeRobot v3.0. meta/modality.json is NOT
#       shipped by the mirror and must be copied from the robocasa assets
#       (see the README); without it the state/action sub-keys cannot resolve.
#
# Sizing: 32/GPU x 4 GPUs = 128 effective batch, 30k steps = 1.72 epochs over
# this dataset's 2,231,347 frames. That is deliberately the same budget as the
# LIBERO-plus configs in this repo (2,238,036 frames -- within 0.3% -- at 128 x
# 30k), and it lands inside the 1.9-2.8 epochs the archived StarVLA baselines
# used. Their 120k-220k step counts reflect datasets 4-7x larger (seen-34 is
# 8.2M frames, target-50 is 15.0M), not a longer schedule per sample.
#
# Camera contract: uses the *_1cam mixture so training sees exactly the one view
# (robot0_agentview_left) that the checked-in evaluation bridge sends.
run_id: starvla_qwenoft_robocasa365_v3_atomic
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_robocasa365
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    # QwenOFT marks action slots with a plain emoji token, not FAST vocabulary,
    # so a stock Qwen3-VL works here; no *-Instruct-Action checkpoint required.
    base_vlm: /e/scratch/m3/misc_data/nogga2/weights/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: MLP
    action_dim: 12
    # 16-D raw proprioception becomes 32-D after the DataConfig's
    # StateActionSinCosTransform; only read when include_state is true.
    state_dim: 32
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /e/home/jusers/blank4/jupiter/datasets/lerobot_3_0
    data_mix: robocasa365_v3_target_atomic_1cam
    lerobot_version: "v3.0"
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    # torchcodec, NOT decord. On these H.264 mirrors decord's seek fails and
    # silently returns a DIFFERENT frame: against a sequential-decode
    # reference it was wrong on 5/10 reads, and against torchcodec 9/12.
    # The "Failed to skip frames effectively ... Aborting skip operation"
    # warnings it prints are that corruption, not a cosmetic notice.
    # torchcodec matched the reference 12/12 and is also far cheaper to open
    # (ctor 16 ms vs 143 ms; fresh read 24 ms vs 158 ms).
    # LIBERO/LIBERO-plus are AV1 (libdav1d) and are NOT affected by this.
    # torchcodec needs the FFmpeg shim: see
    # /e/project1/m3/blank4/containers/ffmpeg_shim/README.md
    video_backend: torchcodec
    # Reader construction dominates on these 183k-frame v3.0 files, so reuse
    # files, and with the cache disabled (the loader default of 0) it is paid
    # on EVERY frame read -- twice per sample at two cameras. Caching readers
    # collapses that: measured per-stage on 200 samples, mean ms/sample and
    # ms/frame of video_decode:
    #     cache  0 -> 370.1 ms/sample, 147.5 ms/frame (79.7%% of loader time)
    #     cache  8 -> 317.8 ms/sample, 120.9 ms/frame  (thrashes: 39 files)
    #     cache 40 -> 156.8 ms/sample,  32.6 ms/frame (41.6%%)
    # 40 covers the whole working set (11 agentview + 17 wrist shards) at
    # ~0.7 MB per single-threaded reader, so ~28 MB per worker.
    video_reader_cache_size: 40
    # The loader defaults to 4 workers, which leaves training data-bound on this
    # dataset: random video seeks cost ~70 ms/frame (sequential is 1.6 ms), and
    # worker parallelism is what hides that. Measured at bs=32 with the prefetch
    # queue drained: 8 -> 1.885 s/batch, 16 -> 0.835, 24 -> 0.437, against a
    # ~1.22 s model step.
    num_workers: 24
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
